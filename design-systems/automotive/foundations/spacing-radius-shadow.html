<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="../tokens.css"><style>body{margin:0;padding:24px;font-family:var(--font-body);color:var(--color-text);background:var(--color-surface)}h3{font:600 16px/1 var(--font-display);margin:24px 0 12px}h3:first-child{margin-top:0}.row{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-end}.c{font:11px/1.4 var(--font-ui);color:var(--color-text-muted);text-align:center}.c b{display:block;color:var(--color-text);font-weight:600}.sp{background:var(--color-brand-700);height:20px;margin-bottom:6px}.bx{width:84px;height:64px;background:var(--color-surface-subtle);border:1px solid var(--color-border-strong);margin-bottom:6px}.sh{width:96px;height:64px;background:#fff;border-radius:var(--radius-md);margin-bottom:6px}</style>
<h3>Spacing (4px base)</h3><div class="row">
<div class="c"><div class="sp" style="width:4px"></div><b>space-1</b>4</div>
<div class="c"><div class="sp" style="width:8px"></div><b>space-2</b>8</div>
<div class="c"><div class="sp" style="width:12px"></div><b>space-3</b>12</div>
<div class="c"><div class="sp" style="width:16px"></div><b>space-4</b>16</div>
<div class="c"><div class="sp" style="width:24px"></div><b>space-5</b>24</div>
<div class="c"><div class="sp" style="width:32px"></div><b>space-6</b>32</div>
<div class="c"><div class="sp" style="width:48px"></div><b>space-7</b>48</div>
<div class="c"><div class="sp" style="width:64px"></div><b>space-8</b>64</div>
<div class="c"><div class="sp" style="width:96px"></div><b>space-9</b>96</div></div>
<h3>Radius</h3><div class="row">
<div class="c"><div class="bx" style="border-radius:var(--radius-xs)"></div><b>xs</b>2 · inputs</div>
<div class="c"><div class="bx" style="border-radius:var(--radius-sm)"></div><b>sm</b>3 · buttons</div>
<div class="c"><div class="bx" style="border-radius:var(--radius-md)"></div><b>md</b>5 · images</div>
<div class="c"><div class="bx" style="border-radius:var(--radius-lg)"></div><b>lg</b>7 · category tiles</div>
<div class="c"><div class="bx" style="border-radius:var(--radius-xl)"></div><b>xl</b>14 · feature tiles</div>
<div class="c"><div class="bx" style="border-radius:var(--radius-pill)"></div><b>pill</b>28 · hero CTAs</div></div>
<h3>Elevation</h3><div class="row" style="background:var(--color-surface-subtle);padding:24px;border-radius:var(--radius-md)">
<div class="c"><div class="sh" style="box-shadow:var(--shadow-hairline)"></div><b>hairline</b>containers</div>
<div class="c"><div class="sh" style="box-shadow:var(--shadow-card)"></div><b>card</b>product tiles</div>
<div class="c"><div class="sh" style="box-shadow:var(--shadow-dropdown)"></div><b>dropdown</b>menus, popovers</div></div>
