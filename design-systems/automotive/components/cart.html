<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="../tokens.css"><style>body{margin:0;padding:24px;font-family:var(--font-body);color:var(--color-text);background:var(--color-surface-page);display:flex;gap:24px;align-items:flex-start}
.box{background:#fff;border:1px solid var(--color-border);border-radius:4px}.box h4{margin:0;padding:20px 24px;font:500 18px/24px var(--font-display);border-bottom:1px solid var(--color-border)}
.cart{width:600px}.th,.tr{display:grid;grid-template-columns:2.4fr 1fr 1fr 1fr;gap:16px;align-items:center;padding:0 24px}.th{height:38px;background:var(--color-neutral-50);border-bottom:1px solid var(--color-border);font:500 12px var(--font-ui);text-transform:uppercase;color:var(--color-neutral-700)}
.tr{height:88px;border-bottom:1px solid var(--color-border);font:400 14px var(--font-display)}.tr .p{display:flex;gap:12px;align-items:center}.tr .im{width:56px;height:56px;background:var(--color-neutral-50);border-radius:var(--radius-xs)}.tr b{font-weight:500}
.q{border:1px solid var(--color-border);border-radius:var(--radius-xs);padding:8px 12px;display:inline-block}
.acts{display:flex;justify-content:space-between;padding:20px 24px}.o{height:48px;padding:0 24px;border:2px solid var(--color-action);background:transparent;color:var(--color-action);border-radius:var(--radius-xs);font:500 14px var(--font-display);cursor:pointer}
.tot{width:300px}.tot .in{padding:20px 24px;font:400 14px var(--font-display);color:var(--color-neutral-700)}.tot .l{display:flex;justify-content:space-between;margin-bottom:12px}.tot .l b{color:var(--color-text);font-weight:500}.tot .t{border-top:1px solid var(--color-border);padding-top:16px;color:var(--color-text);font-size:16px}.tot .t b{font-weight:600}
.go{width:100%;height:56px;border:0;border-radius:var(--radius-sm);background:var(--color-action);color:#fff;font:500 16px var(--font-display);margin-top:16px;cursor:pointer}.go:hover{background:var(--color-action-hover)}</style>
<div class="box cart"><h4>Shopping Cart</h4><div class="th"><span>Products</span><span>Price</span><span>Quantity</span><span>Sub-total</span></div>
<div class="tr"><div class="p"><div class="im"></div><b>Raybestos R-Line rotor</b></div><span style="color:var(--color-neutral-700)">$70</span><span><i class="q" style="font-style:normal">01</i></span><b>$70</b></div>
<div class="tr"><div class="p"><div class="im"></div><b>Ceramic brake pad set</b></div><span style="color:var(--color-neutral-700)">$250</span><span><i class="q" style="font-style:normal">01</i></span><b>$250</b></div>
<div class="acts"><button class="o">Return to Shop</button><button class="o">Update Cart</button></div></div>
<div class="box tot"><h4>Cart Totals</h4><div class="in"><div class="l">Sub-total<b>$320.00</b></div><div class="l">Shipping<b>Free</b></div><div class="l">Tax<b>$37.99</b></div><div class="l t">Total<b>$357.99 USD</b></div><button class="go">Proceed to Checkout</button></div></div>
