<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="../tokens.css"><style>body{margin:0;padding:24px;font-family:var(--font-body);color:var(--color-text);background:var(--color-surface)}h3{font:600 16px/1 var(--font-display);margin:0 0 12px}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:24px}
.b{font:600 12px/16px var(--font-ui);padding:5px 10px;border-radius:var(--radius-xs);color:#fff;text-transform:uppercase}
.hot{background:var(--color-danger-500)}.disc{background:var(--color-warning-400);color:var(--color-neutral-900)}.sale{background:var(--color-success-500)}.best{background:var(--color-info-500)}.sold{background:var(--color-neutral-400)}.brand{background:var(--color-brand-700)}.gold{background:var(--color-accent-gradient);color:var(--color-neutral-900)}
.stars{color:var(--color-rating);letter-spacing:2px;font-size:16px}.stars span{color:var(--color-neutral-100)}.rate{font:400 14px var(--font-ui);color:var(--color-neutral-700);margin-left:8px;letter-spacing:0}
.fit{display:inline-flex;gap:8px;align-items:center;font:500 14px var(--font-display);padding:8px 14px;border-radius:var(--radius-full);background:var(--color-success-50);color:var(--color-success-600);border:1px solid var(--color-success-500)}.fit.no{background:var(--color-danger-50);color:var(--color-danger-600);border-color:var(--color-danger-500)}</style>
<h3>Merchandising badges</h3><div class="row"><span class="b hot">Hot</span><span class="b disc">25% off</span><span class="b sale">Sale</span><span class="b best">Best deals</span><span class="b sold">Sold out</span><span class="b brand">OEM</span><span class="b gold">Premium</span></div>
<h3>Rating</h3><div class="row"><span class="stars">★★★★<span>★</span><i class="rate">4.6 (16,600+ reviews)</i></span></div>
<h3>Fitment status</h3><div class="row"><span class="fit">✓ Fits your 2021 Honda Civic</span><span class="fit no">✕ Does not fit your vehicle</span></div>
