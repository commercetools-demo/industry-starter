<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="../tokens.css"><style>body{margin:0;padding:24px;font-family:var(--font-body);color:var(--color-text);background:var(--color-surface)}h3{font:600 16px/1 var(--font-display);margin:0 0 12px}.grid{display:grid;grid-template-columns:repeat(3,260px);gap:16px;margin-bottom:24px}
.f{height:44px;box-sizing:border-box;padding:0 16px;display:flex;align-items:center;justify-content:space-between;border:1px solid var(--color-border);border-radius:var(--radius-xs);background:#fff;font:400 14px/20px var(--font-ui);color:var(--color-neutral-500)}
.f.focus{border-color:var(--color-focus);color:var(--color-text)}.f.filled{color:var(--color-neutral-700)}
.f.ok{background:var(--color-success-50);border-color:var(--color-success-500);color:var(--color-neutral-700)}.f.warn{background:var(--color-warning-50);border-color:var(--color-warning-500);color:var(--color-neutral-700)}.f.err{background:var(--color-danger-50);border-color:var(--color-danger-500);color:var(--color-neutral-700)}
.fit{display:flex;gap:16px;align-items:center}.fit .f{width:200px;height:60px;border-color:var(--color-border-strong);font:400 18px var(--font-display);color:var(--color-text-strong)}
.qty{display:inline-flex;align-items:center;justify-content:space-between;width:164px;height:56px;box-sizing:border-box;padding:0 20px;border:2px solid var(--color-border);border-radius:var(--radius-sm);font:400 16px var(--font-display);color:var(--color-neutral-700)}
.list{width:240px;border:1px solid var(--color-border);border-radius:var(--radius-xs);box-shadow:var(--shadow-dropdown);font:400 14px var(--font-ui)}.list div{padding:10px 16px;color:var(--color-neutral-700)}.list div.h{background:var(--color-neutral-50);color:var(--color-text)}</style>
<h3>Text field states</h3><div class="grid">
<div class="f">Email address</div><div class="f focus">Typing…</div><div class="f filled">Completed.</div>
<div class="f ok">Success <span style="color:var(--color-success-500)">✓</span></div><div class="f warn">Warning <span style="color:var(--color-warning-500)">!</span></div><div class="f err">Error <span style="color:var(--color-danger-500)">!</span></div></div>
<h3>Vehicle fitment (Year / Brand / Model)</h3><div class="fit"><div class="f">Year <span>⌄</span></div><div class="f">Brand <span>⌄</span></div><div class="f">Model <span>⌄</span></div></div>
<h3 style="margin-top:24px">Quantity and dropdown</h3><div style="display:flex;gap:24px;align-items:flex-start"><span class="qty"><span>−</span>01<span>+</span></span><div class="list"><div>Front disc brake</div><div class="h">Rear disc brake</div><div>Brake pads</div></div></div>
