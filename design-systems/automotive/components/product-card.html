<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="../tokens.css"><style>body{margin:0;padding:24px;font-family:var(--font-body);color:var(--color-text);background:var(--color-surface-page);display:flex;gap:32px;flex-wrap:wrap;align-items:flex-start}
.card{position:relative;width:260px;background:#fff;border:1px solid var(--color-border);border-radius:var(--radius-sm);padding:16px;box-sizing:border-box;box-shadow:var(--shadow-card)}
.card .img{height:180px;border-radius:var(--radius-md);background:var(--color-neutral-50);display:grid;place-items:center;font:12px var(--font-ui);color:var(--color-neutral-400);margin-bottom:12px}
.tag{position:absolute;top:24px;left:24px;font:600 12px/16px var(--font-ui);padding:5px 10px;border-radius:var(--radius-xs);background:var(--color-danger-500);color:#fff}
.brand{font:500 12px var(--font-ui);color:var(--color-neutral-500);text-transform:uppercase;letter-spacing:var(--tracking-label)}
.name{font:400 14px/1.4 var(--font-display);color:var(--color-text);margin:4px 0 8px;height:40px;overflow:hidden}
.stars{color:var(--color-rating);font-size:14px;letter-spacing:2px}.stars i{font:400 12px var(--font-ui);color:var(--color-neutral-500);letter-spacing:0;font-style:normal;margin-left:6px}
.price{font:600 20px var(--font-display);color:var(--color-text-price);margin:8px 0 12px}.price s{font:400 14px var(--font-display);color:var(--color-text-price-old);margin-left:6px}
.fit{font:500 12px var(--font-ui);color:var(--color-success-600);margin-bottom:12px}
.add{width:100%;height:44px;border:0;border-radius:var(--radius-sm);background:var(--color-action);color:#fff;font:500 14px var(--font-display);cursor:pointer}.add:hover{background:var(--color-action-hover)}
.row{display:flex;gap:12px;width:313px;padding:12px;box-sizing:border-box;background:#fff;border:1px solid var(--color-border);border-radius:var(--radius-sm)}.row .th{width:80px;height:80px;background:var(--color-neutral-50);border-radius:var(--radius-xs);flex:none}.row b{font:400 14px/1.4 var(--font-display);display:block}.row span{font:600 14px var(--font-display);color:var(--color-text-price)}</style>
