<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="../tokens.css"><style>body{margin:0;padding:24px;font-family:var(--font-body);color:var(--color-text);background:var(--color-surface-page)}h3{font:600 16px/1 var(--font-display);margin:0 0 12px}.row{display:flex;gap:32px;align-items:flex-start;margin-bottom:32px}.c{font:11px/1.4 var(--font-ui);color:var(--color-text-muted);text-align:center}.c b{display:block;color:var(--color-text);font-weight:600;margin-top:8px}
.cart{position:relative;width:48px;height:48px;border:0;border-radius:var(--radius-sm);background:transparent;display:grid;place-items:center;cursor:pointer;color:var(--color-neutral-900)}.cart:hover{background:var(--color-neutral-50)}.cart:focus-visible{outline:3px solid var(--color-brand-200)}
.cart svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.cart .n{position:absolute;top:2px;right:0;min-width:20px;height:20px;box-sizing:border-box;border-radius:var(--radius-full);background:var(--color-brand-700);color:#fff;font:600 12px/20px var(--font-ui);text-align:center;padding:0 5px;border:2px solid #fff}
.cart.on{color:var(--color-action)}.cart.on svg{fill:var(--color-brand-100)}
.dark{background:var(--color-brand-deep);padding:12px 24px;border-radius:var(--radius-md);display:flex;align-items:center;gap:12px;color:#fff;font:700 15px var(--font-display)}.dark .cart{color:#fff}.dark .cart:hover{background:rgba(255,255,255,.12)}.dark .cart .n{background:var(--color-accent-500);color:var(--color-neutral-900);border-color:var(--color-brand-deep)}
.mini{width:360px;background:#fff;border:1px solid var(--color-border);border-radius:var(--radius-sm);box-shadow:var(--shadow-dropdown)}.mini h4{margin:0;padding:16px 20px;font:500 16px var(--font-display);border-bottom:1px solid var(--color-border)}.mini h4 span{color:var(--color-neutral-500);font-weight:400}
.it{display:flex;gap:12px;align-items:center;padding:12px 20px;border-bottom:1px solid var(--color-border);font:400 14px/1.4 var(--font-display)}.it i{width:56px;height:56px;background:var(--color-neutral-50);border-radius:var(--radius-xs);flex:none}.it div{flex:1}.it small{display:block;font:400 12px var(--font-ui);color:var(--color-neutral-500)}.it b{font-weight:600;color:var(--color-text-price)}
.tot{display:flex;justify-content:space-between;padding:16px 20px 8px;font:500 14px var(--font-display)}.tot b{font-weight:600}.btns{display:grid;gap:8px;padding:8px 20px 20px}.btns button{height:48px;border-radius:var(--radius-sm);font:500 14px var(--font-display);cursor:pointer;border:2px solid var(--color-action)}.p{background:var(--color-action);color:#fff}.p:hover{background:var(--color-action-hover)}.o{background:transparent;color:var(--color-action)}.o:hover{background:var(--color-action-subtle)}</style>
<h3>Cart icon states</h3><div class="row">
<div class="c"><button class="cart" aria-label="Cart"><svg viewBox="0 0 24 24"><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M2 3h3l2.5 12h11l2-8H6"/></svg></button><b>empty</b></div>
<div class="c"><button class="cart" aria-label="Cart, 2 items"><svg viewBox="0 0 24 24"><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M2 3h3l2.5 12h11l2-8H6"/></svg><span class="n">2</span></button><b>with count</b></div>
<div class="c"><button class="cart on" aria-label="Cart, 2 items, open"><svg viewBox="0 0 24 24"><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M2 3h3l2.5 12h11l2-8H6"/></svg><span class="n">2</span></button><b>active / open</b></div>
<div class="c"><div class="dark"><button class="cart" aria-label="Cart, 2 items"><svg viewBox="0 0 24 24"><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M2 3h3l2.5 12h11l2-8H6"/></svg><span class="n">2</span></button>Cart</div><b>on maroon header</b></div></div>
<h3>Mini-cart dropdown</h3>
<div class="mini"><h4>Your Cart <span>(2 items)</span></h4>
<div class="it"><i></i><div>Raybestos R-Line rotor<small>Qty 1</small></div><b>$70</b></div>
<div class="it"><i></i><div>Ceramic brake pad set<small>Qty 1</small></div><b>$250</b></div>
<div class="tot"><span>Sub-total</span><b>$320.00</b></div>
<div class="btns"><button class="o">View Cart</button><button class="p">Checkout</button></div></div>
