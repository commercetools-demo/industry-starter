<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="../tokens.css"><style>
*{box-sizing:border-box}body{margin:0;padding:24px;font-family:var(--font-sans);color:var(--color-text);background:var(--color-bg-surface);display:flex;flex-direction:column;gap:16px}
.panel{background:var(--color-bg-page);color:var(--color-text);padding:24px;border-radius:var(--radius-300);border:1px solid var(--color-border-subdued)}
h3{font:600 15px/24px var(--font-sans);letter-spacing:var(--tracking-body-1);margin:0 0 12px;color:var(--color-text)}h3:not(:first-child){margin-top:24px}
.row{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start}.c{font:500 12px/16px var(--font-sans);color:var(--color-text-subdued);text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px}
svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:10px 18px;border-radius:var(--radius-300);font:700 15px/24px var(--font-sans);letter-spacing:var(--tracking-button-1);cursor:pointer;border:1px solid var(--color-border);background:var(--color-bg-surface);color:var(--color-text);box-shadow:var(--shadow-button);white-space:nowrap}
.btn.sm{height:36px;padding:8px 12px;border-radius:var(--radius-200);font-size:13px;line-height:20px}.btn.sm svg{width:20px;height:20px}
.btn.primary{background:var(--color-bg-brand);border-color:var(--color-border-on);color:var(--color-text-on)}
.btn:hover,.btn.hov{background:var(--color-bg-surface-hover);border-color:var(--color-border-hover)}
.btn.primary:hover,.btn.primary.hov{background:var(--color-bg-brand-hover);border-color:var(--color-border-on)}
.btn:active,.btn.prs{background:var(--color-bg-surface-pressed);border-color:var(--color-border-pressed);box-shadow:var(--shadow-button-pressed)}
.btn.primary:active,.btn.primary.prs{background:var(--color-bg-brand-pressed);color:var(--color-text-on-pressed)}
.btn:focus-visible,.btn.foc{outline:none;box-shadow:var(--shadow-focus)}
.btn[disabled],.btn.dis{background:var(--color-bg-surface-disabled);border-color:transparent;box-shadow:none;color:var(--color-text-disabled);cursor:not-allowed}
.btn.primary[disabled],.btn.primary.dis{background:var(--color-bg-brand-disabled);color:var(--color-text-on)}
.ib{width:36px;height:36px;border-radius:var(--radius-full);border:0;background:transparent;color:var(--color-text);display:inline-grid;place-items:center;cursor:pointer;padding:0}
.ib.md{width:44px;height:44px}.ib:hover,.ib.hov{background:var(--color-bg-surface-hover)}.ib.act{background:var(--color-bg-surface-hover);color:var(--color-text-active)}.ib:focus-visible{outline:none;box-shadow:var(--shadow-focus)}
.ib.like.act{color:var(--color-text-critical)}.ib.like.act svg{fill:currentColor}
.ib.on{background:var(--color-bg-surface);box-shadow:var(--shadow-button);border:1px solid var(--color-border)}
.grp{display:inline-flex;background:var(--color-bg-surface);border-radius:var(--radius-300);padding:0;overflow:hidden;border:1px solid var(--color-border)}
.grp button{width:40px;height:34px;border:0;border-right:1px solid var(--color-border-subdued);background:transparent;color:var(--color-text);display:grid;place-items:center;cursor:pointer;padding:0}.grp button:last-child{border:0}.grp button:hover{background:var(--color-bg-surface-hover)}.grp svg{width:20px;height:20px}
.sp{width:44px;height:44px;border-radius:50%;border:4px solid var(--color-bg-surface-subdued);border-top-color:var(--color-text);animation:r 1s linear infinite}.sp.s{width:20px;height:20px;border-width:2px}
.sp.f1{animation:none;transform:rotate(0)}.sp.f2{animation:none;transform:rotate(120deg)}.sp.f3{animation:none;transform:rotate(240deg)}
@keyframes r{to{transform:rotate(360deg)}}
.lm{display:flex;flex-direction:column;align-items:center;padding:16px 0}
.rx{display:inline-flex;gap:8px;padding:4px;background:var(--color-bg-surface);border-radius:var(--radius-full);box-shadow:var(--shadow-card)}
.rx button{width:32px;height:32px;border-radius:50%;border:0;background:var(--color-bg-surface-subdued);font-size:18px;line-height:1;cursor:pointer;padding:0;transition:transform .1s}.rx button:hover{transform:scale(1.2)}
</style>
