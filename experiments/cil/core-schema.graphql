"""
Refusal of a mutation that the caller can correct or act on. Check the `userErrors`
list of every mutation result before you read its resource field.

Top-level GraphQL errors are used for transport errors and unexpected failures.
"""
type UserError @shareable {
  """Kind of error. Handle each case in your client by this code."""
  code: UserErrorCode!
  """
  Description of the error that you can display or log. To localize the error, map
  from `code` instead. Don't parse the message: platform identifiers and permission
  names are removed from it, and its structure isn't stable.
  """
  message: String!
  """
  Dotted path to the input value that caused the error. The path starts with the
  argument name of the mutation, followed by nested input fields and list indices. For
  example, `input.postalCode` on `setShippingAddress`, `inputs.2.sku` on
  `addCartLines`, or `orderId` on `cancelOrder`.
  
  `null` if no input value is at fault, for example for a missing permission, the
  state of the resource, or a missing precondition such as
  `SHIPPING_ADDRESS_REQUIRED`.
  """
  field: String
  """
  Correlation ID of the request that returned the error. Include it in a support
  request to identify the request across all services it reached.
  
  If you send an `X-Correlation-ID` header, this is usually the value you sent.
  Otherwise, it's the ID generated for the request. All entries of one `userErrors`
  list have the same value. `null` for an error raised outside a request.
  """
  correlationId: String
}

"""Kinds of refusal that a mutation can return in `UserError.code`."""
enum UserErrorCode {
  """A line of the Cart is out of stock."""
  OUT_OF_STOCK
  """The Store doesn't sell this Product."""
  NOT_IN_ASSORTMENT
  """
  The Store sells this Product but has no price for it in the session's currency,
  country, or distribution channel. Another currency or distribution channel may make
  it available.
  """
  PRICE_NOT_AVAILABLE
  """The quantity isn't allowed, for example because it's zero or negative."""
  INVALID_QUANTITY
  """No line with this ID exists on the Cart, Shopping List, or Order."""
  LINE_NOT_FOUND
  """No published Product has this SKU."""
  UNKNOWN_SKU
  """The session has no Cart, or the Cart has no line items."""
  EMPTY_CART
  """
  The Shipping Method doesn't exist, the ID isn't valid, or the Shipping Method has no
  rate for the Cart's shipping address.
  """
  UNKNOWN_SHIPPING_METHOD
  """
  `PaymentInput.methodKey` names a payment method that the project doesn't accept.
  The accepted methods can change during checkout, so read `paymentMethods` again
  and retry.
  """
  UNKNOWN_PAYMENT_METHOD
  """
  No Checkout configuration of the project matches the session's country and Store,
  so `beginPayment` can't start a payment.
  """
  CHECKOUT_NOT_CONFIGURED
  """
  The Cart has no shipping address. Set the shipping address before you select a
  Shipping Method or request a Quote.
  """
  SHIPPING_ADDRESS_REQUIRED
  """
  The project has no tax rate for the country of the address, so the address can't be
  used on a Cart. `addAddress` and `updateAddress` return this code for a country
  that isn't a valid country code.
  """
  SHIPPING_COUNTRY_NOT_SUPPORTED
  """
  The country isn't a valid two-letter ISO 3166-1 alpha-2 code in upper case, such as
  `GB`.
  """
  INVALID_COUNTRY
  """
  The distribution channel given for the line can't select a price for it, because the
  channel doesn't exist, the ID isn't valid, or the channel doesn't have the
  `ProductDistribution` role. See
  `AddCartLineInput.distributionChannelIdOverride`.
  """
  INVALID_DISTRIBUTION_CHANNEL
  """
  The project's line item extension returned an error for this line, so nothing was
  added to the Cart. The message doesn't carry the extension's own error.
  """
  LINE_ITEM_HOOK_FAILED
  """
  The request contains an invalid value that no more specific code covers, for example
  a blank ID. `message` describes the problem.
  """
  INVALID_INPUT
  """The viewer doesn't have the permission for this action."""
  FORBIDDEN_ACTION
  """
  The operation requires a signed-in Customer, and the session has none.
  `createBusinessUnit` also returns it when the session lacks permission in the
  parent Business Unit, with `field` set to `input.parentUnitKey`.
  """
  NOT_AUTHORIZED
  """
  The operation requires a selected Business Unit and Store, and the session is
  missing one of them.
  """
  BUSINESS_UNIT_REQUIRED
  """The discount code doesn't exist, isn't active, or isn't valid."""
  INVALID_DISCOUNT_CODE
  """The discount code is outside its validity period."""
  DISCOUNT_CODE_EXPIRED
  """
  The discount code exists but can't be applied to this Cart, for example because it
  doesn't match the Cart or has reached its maximum number of applications.
  """
  DISCOUNT_CODE_NOT_APPLICABLE
  """The discount code is already on the Cart."""
  DISCOUNT_CODE_ALREADY_APPLIED
  """No Order with this ID is visible to the current session."""
  ORDER_NOT_FOUND
  """
  The Order can't be returned in its current state, or a quantity exceeds what can
  still be returned.
  """
  RETURN_NOT_ALLOWED
  """
  The Order can't be cancelled in its current state, for example because it's complete
  or already cancelled.
  """
  ORDER_NOT_CANCELLABLE
  """
  The active Cart already has items. To add the items to it, retry `reorder` with
  `into: ACTIVE_CART`, or clear the Cart first.
  """
  CART_NOT_EMPTY
  """
  No Quote with this ID is visible to the current session, because it doesn't exist or
  belongs to a Business Unit that the session hasn't selected.
  """
  QUOTE_NOT_FOUND
  """
  The state of the Quote doesn't allow the action. Only a `PENDING` Quote can be
  accepted, declined, or renegotiated. A missing permission returns
  `FORBIDDEN_ACTION`, and an expired Quote returns `QUOTE_EXPIRED`.
  """
  QUOTE_NOT_ACTIONABLE
  """
  The Quote is past its `expiresAt`, so it can no longer be accepted, declined, or
  renegotiated. Its `quoteState` is still `PENDING`, and its `availableActions`
  is empty.
  """
  QUOTE_EXPIRED
  """
  The Cart has discount codes, and a Quote can't be requested for a Cart with discount
  codes. Remove the codes and try again. The Cart is unchanged.
  """
  QUOTE_CART_HAS_DISCOUNT_CODES
  """
  No Quote Request with this ID is visible to the current session, because it doesn't
  exist or belongs to a Business Unit that the session hasn't selected.
  """
  QUOTE_REQUEST_NOT_FOUND
  """
  The state of the Quote Request doesn't allow the action. Only a `SUBMITTED` Quote
  Request can be cancelled.
  """
  QUOTE_REQUEST_NOT_ACTIONABLE
  """
  The approval can't be approved or rejected, for example because it's no longer
  pending.
  """
  APPROVAL_NOT_PENDING
  """Rejecting an Order requires a `reason`, and none was given."""
  APPROVAL_REASON_REQUIRED
  """No Approval Rule with this ID is visible to the current session."""
  APPROVAL_RULE_NOT_FOUND
  """
  No Associate Role with this key exists in the project. `field` points to the
  entry.
  """
  ASSOCIATE_ROLE_NOT_FOUND
  """
  The approval condition can't be expressed with `ApprovalConditionInput`, the
  `conditions` list is empty, or you replaced the conditions of an Approval Rule
  whose `conditionsFullyTyped` is `false`. `field` names the condition,
  `message` says what is supported, and the stored Approval Rule is unchanged.
  """
  CONDITION_NOT_SUPPORTED
  """
  The Approval Rule has no approver tiers, a tier without approver groups, or a group
  without Associate Roles. Such a rule would block every matching Order, because
  nobody could approve it.
  """
  APPROVER_TIERS_REQUIRED
  """No Shopping List with this ID is visible to the current session."""
  LIST_NOT_FOUND
  """
  No Customer in the project has this email address. You can only add an Associate who
  already has a Customer account.
  """
  CUSTOMER_NOT_FOUND
  """A Business Unit with this key already exists."""
  BUSINESS_UNIT_KEY_EXISTS
  """
  No saved address with this ID exists, or no ID was given and the Cart has no
  shipping address to use.
  """
  ADDRESS_NOT_FOUND
  """The current password is incorrect."""
  INVALID_CURRENT_PASSWORD
  """Another Customer already uses this email address."""
  EMAIL_ALREADY_IN_USE
}

