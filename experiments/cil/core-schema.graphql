A Line Item's price after its Product Discount, per unit, and whether a Best Deal rejected it.
"""
type LineItemDiscountedPrice {
  value: Money!
  productDiscount: ProductDiscountInfo!
  """
  Whether a Best Deal won by Cart Discounts dropped this Product Discount from the Line Item. If so, its Portions start from `unitPriceBeforeDiscount`, and the Product Discount counts in neither `discounts` nor `discountTotal`.
  """
  rejectedByBestDeal: Boolean!
