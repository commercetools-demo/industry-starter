  """
  Lines of the Cart, with Product Variant lines first and custom lines last.
  """
  lines: [CartLine!]!
  """
  Every applied discount, one entry per discount and target, its `amount` summed over the cart: Product Discounts included, except where a Best Deal rejected them. The non-SHIPPING entries add up to `totals.discountTotal`.
  """
  discounts: [AppliedDiscount!]!
  """How Product Discounts and Cart Discounts were combined on this cart."""
  discountCombination: DiscountCombination!
  """The Discount Codes entered on this cart, and where each stands."""
  discountCodes: [DiscountCodeInfo!]!
  """Totals of the Cart, to display in the cart summary."""
  totals: PriceTotals!
  """
  Shipping address of the Cart. Determines which Shipping Methods are available.
  `null` if not set.
