"""
Lifecycle of a returned item's refund. An `ADVISED` item starts as
`NON_REFUNDABLE` and a `RETURNED` item starts as `INITIAL`. From `INITIAL`,
the merchant moves it to `REFUNDED` or `NOT_REFUNDED`.
"""
enum ReturnPaymentState {
  """A refund can be made for the item but is not settled yet."""
  INITIAL
  """No refund can be made for the item."""
  NON_REFUNDABLE
  """The payment for the item is refunded."""
  REFUNDED
  """The payment for the item is not refunded."""
  NOT_REFUNDED
}

"""Result of `requestReturn`."""
