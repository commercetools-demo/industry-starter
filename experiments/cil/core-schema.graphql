"""
An offer from the Seller in response to a Quote Request. The Buyer can accept,
decline, or renegotiate it. For more information, see [Quotes
overview](https://docs.commercetools.com/api/quotes-overview).
"""
type Quote implements Node {
  """Unique identifier of the Quote."""
  id: ID!
  """
  Reference to show for the Quote: its key, or its platform ID if no key is set.
  """
  reference: String!
  """Current state of the Quote."""
  quoteState: QuoteState!
  """
  Business Unit the Quote belongs to. If the session can't read that Business Unit,
  this field returns an error, which makes the enclosing Quote `null`.
  """
  businessUnit: BusinessUnit!
  """Total quantity of all lines."""
  itemCount: Int!
  """
  Amount the Buyer pays if they accept the Quote, tax included. Same value as
  `totals.grandTotal`.
  """
  total: Money!
  """
  Price breakdown behind `total`, computed the same way as for a Cart and an Order.
  `shipping` is `null` if the Quote has no Shipping Method.
  """
  totals: PriceTotals!
  """
  Every applied discount on the quote, one entry per discount and target, its `amount` summed over the quote: Product Discounts included where applied, and a seller's Direct Discounts. The non-SHIPPING entries add up to `totals.discountTotal`.
  """
  discounts: [AppliedDiscount!]!
  """Date and time (UTC) the Quote was created."""
  createdAt: DateTime!
  """
  Date and time (UTC) the Quote expires. `null` if the Seller set no expiry.
  
  After this time, the Quote can't be acted on and `availableActions` is empty.
  `quoteState` doesn't change when the Quote expires, so a `PENDING` Quote can be
  expired.
  """
  expiresAt: DateTime
  """
  Buyer who requested the Quote, with the Associate Roles they hold in the Business
  Unit. `null` if no Buyer is recorded. If the Buyer has left the Business Unit,
  `roles` is empty.
  """
  requestedBy: Associate
  """Lines of the Quote."""
  lines: [QuoteLine!]!
  """
  Latest message from the Buyer: the message sent with a renegotiation request, or the
  reason given when declining.
  """
  buyerComment: String
  """Message from the Seller included in the Quote."""
  sellerComment: String
  """
  Purchase order number copied unchanged from the Quote Request. It can't be changed.
  """
  purchaseOrderNumber: String
  """
  Actions that the current Associate can take on the Quote, based on their permissions
  for their own Quotes or for Quotes of other Associates. Empty unless the Quote is
  `PENDING` and hasn't expired. `acceptQuote`, `declineQuote`, and
  `renegotiateQuote` refuse an action that isn't listed here.
  """
  availableActions: [QuoteAction!]!
}

"""Action on a Quote that `Quote.availableActions` can offer."""
enum QuoteAction {
  """
  Accept the Quote with `acceptQuote`, which also creates an Order from it. Offered
  only if the Associate has permission both to accept the Quote and to create an Order
  from it.
  """
  ACCEPT
  """Ask the Seller to renegotiate the Quote with `renegotiateQuote`."""
  RENEGOTIATE
  """
  Decline the Quote with `declineQuote`. If `RENEGOTIATE` isn't offered, decline
  without a `reason`.
  """
  DECLINE
}

"""Paginated result of `quotes`."""
type QuoteConnection {
  """Quotes on this page, with their cursors."""
  edges: [QuoteEdge!]!
  """Quotes on this page, in the same order as `edges`."""
  nodes: [Quote!]!
  """Information for getting the next or previous page."""
  pageInfo: PageInfo!
  """Total number of Quotes that match the query, across all pages."""
  totalCount: Int!
}

"""Entry in a `QuoteConnection`."""
type QuoteEdge {
  """The Quote."""
  node: Quote!
  """
  Opaque cursor of this item. Pass it as `after` to get the items that follow it.
  """
  cursor: String!
}

"""Filters for `quotes`. A Quote must match every field you set."""
input QuoteFilter {
  """
  Matches a Quote whose `reference` equals this value. The match is exact, not a
  substring search.
