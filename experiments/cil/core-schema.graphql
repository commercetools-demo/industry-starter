"""
enum DiscountCodeState {
  """The code, or every Cart Discount it unlocks, is not active."""
  NOT_ACTIVE
  """The code's Cart Discounts are outside their validity dates."""
  NOT_VALID
  """
  The code is usable, but neither it nor its Cart Discounts match this cart.
  """
  DOES_NOT_MATCH_CART
  """
  The code matches this cart. Under a Best Deal won by Product Discounts its Cart Discounts are still discarded: check `discountCombination.bestDealWinner`.
  """
  MATCHES_CART
  """The code's overall or per-customer application limit is reached."""
  MAX_APPLICATION_REACHED
  """
  A Cart Discount applied earlier stopped further discounts, so this code's Cart Discounts did not apply.
  """
  APPLICATION_STOPPED_BY_PREVIOUS_DISCOUNT
  """Another Cart Discount in the same Discount Group gave a better deal."""
  APPLICATION_STOPPED_BY_GROUP_BEST_DEAL
}

"""How the discounts on this cart or order were combined."""
type DiscountCombination {
  mode: DiscountCombinationMode!
  """Which side won the Best Deal; null under `STACKING`."""
  bestDealWinner: BestDealWinner
}

"""
How Product Discounts and Cart Discounts combine, as the project is configured.
"""
enum DiscountCombinationMode {
  """
  Both apply: Cart Discounts reduce prices that Product Discounts have already reduced.
  """
  STACKING
  """
  Product Discounts and Cart Discounts compete, decided once for the whole cart, and the side giving the lower total applies. Gift, shipping and total-price discounts, and Direct Discounts that opt out of the comparison, apply whichever side wins.
  """
  BEST_DEAL
}

"""
A Discount Group: Cart Discounts of which only the one giving the lowest cart total applies.
"""
type DiscountGroup {
  key: String!
  """
  The Discount Group's name in the session's locale; null where it has none for that locale.
  """
  name: String
}

"""Where a discount comes from."""
enum DiscountSource {
  """
  A Product Discount: a reduction of the product's price, present before the product reaches the cart.
  """
  PRODUCT_DISCOUNT
  """A Cart Discount that applies on its own to every cart it matches."""
  CART_DISCOUNT
  """
  A Cart Discount unlocked by a Discount Code the shopper entered; the only kind `removeDiscountCode` removes. One code can unlock several Cart Discounts, each its own entry.
  """
  DISCOUNT_CODE
  """
  A Direct Discount: a Cart Discount a seller set on this one cart, order or quote.
  """
  DIRECT_DISCOUNT
}

"""
What a Cart Discount applies to, named as the Merchant Center's "Apply this effect to" names it.
"""
enum DiscountTarget {
  """Whole Line Items matching the discount's conditions."""
  LINE_ITEMS
  """
  Units discounted once a set of trigger units is in the cart: buy these, get those. A pattern target with a trigger pattern in the platform.
  """
  BUY_AND_GET
  """
  A set of units discounted together, only when the whole set is in the cart. A pattern target without a trigger pattern in the platform.
  """
  DISCOUNT_BUNDLE
  """
  Some units of matching Line Items, once enough of them are in the cart.
  """
  MULTIBUY_LINE_ITEMS
  """The cart's total price; applied after every other Cart Discount."""
  TOTAL_PRICE
  """The delivery charge, across every shipment; not in `discountTotal`."""
  SHIPPING
}

"""
How a discount reduces: the discount's value type. A display hint; the money is in `amount`.
"""
enum DiscountValueType {
  """Percentage off the price."""
  RELATIVE
  """Fixed amount off the price."""
  ABSOLUTE
  """Fixed final price."""
  FIXED
  """Free Product added to the Cart; Cart Discounts only."""
  GIFT_LINE_ITEM
  """A reduced price set by an external system; Product Discounts only."""
  EXTERNAL
}

"""A product's price after its Product Discount, per unit."""
type DiscountedPrice {
  value: Money!
  productDiscount: ProductDiscountInfo!
}

"""
Filter-rail entry for one attribute of the search result.

Facets are built from the Project's searchable attributes of type enum, localized
enum, boolean, and number. To filter on a value that `options` doesn't list, pass it
in `ProductFilter.attributes`.
"""
type Facet {
  """
  Identifier of the attribute, in the format `variants.attributes.<attributeName>`.
  Pass it unchanged as `code` in `AttributeFilterInput` or
  `AttributeRangeFilterInput`.
  """
  code: String!
  """
  Display label of the attribute for the session's locale. Falls back to the attribute
  name.
  """
  label: String!
  """
  Up to 10 most common values, highest `count` first. Values with the same count are
  sorted by `value`, so the order is stable between requests.
  """
  options: [FacetOption!]!
}

"""A selectable entry of a `Facet`."""
type FacetOption {
  """
  Attribute value as stored, such as an enum key. Pass it in
  `AttributeFilterInput.values` to filter on it.
  """
  value: String!
  """
  Display label of the value for the session's locale. Falls back to `value` when
  the value has no label.
