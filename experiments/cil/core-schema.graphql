  Reference to show for the Quote Request: its key, or its platform ID if no key is
  set.
  """
  reference: String!
  """Current state of the Quote Request."""
  quoteRequestState: QuoteRequestState!
  """
  Business Unit the Quote Request belongs to. If the session can't read that Business
  Unit, this field returns an error, which makes the enclosing Quote Request `null`.
  """
  businessUnit: BusinessUnit!
  """Total quantity of all lines."""
  itemCount: Int!
  """
  Total of the Quote Request, tax included. Same value as `totals.grandTotal`.
  """
  total: Money!
  """
  Price breakdown behind `total`, computed the same way as for a Cart and an Order.
  `shipping` is `null` if the Quote Request has no Shipping Method.
  """
  totals: PriceTotals!
  """
  Every applied discount on the request, one entry per discount and target, its `amount` summed over the request: Product Discounts included where applied. The non-SHIPPING entries add up to `totals.discountTotal`.
  """
  discounts: [AppliedDiscount!]!
  """Date and time (UTC) the Quote Request was created."""
  createdAt: DateTime!
  """
  Buyer who created the Quote Request, with the Associate Roles they hold in the
  Business Unit. `null` if no Buyer is recorded. If the Buyer has left the Business
  Unit, `roles` is empty.
  """
  requestedBy: Associate
  """
  Lines for which a Quote is requested, copied from the Cart when the request was
  created.
  """
  lines: [QuoteLine!]!
  """
  Message from the Buyer included in the Quote Request. Set from `message` in
  `RequestQuoteInput`.
  """
  comment: String
  """
  Purchase order number that the Buyer set when requesting the Quote. It can't be
  changed afterward, and it's copied unchanged to the resulting Quote.
  """
  purchaseOrderNumber: String
}

"""Paginated result of `quoteRequests`."""
type QuoteRequestConnection {
  """Quote Requests on this page, with their cursors."""
  edges: [QuoteRequestEdge!]!
  """Quote Requests on this page, in the same order as `edges`."""
  nodes: [QuoteRequest!]!
  """Information for getting the next or previous page."""
