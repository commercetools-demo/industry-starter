extend type ApprovalFlow @key(fields: "id")
extend type ApprovalRule @key(fields: "id") @key(fields: "key")
extend type AssociateRole @key(fields: "key")

"What a storefront handed over to authenticate with. Opaque to this layer."
input CilLoginInput @inaccessible {
  code: String!
}

"Who the shopper is, as the project's extension resolved it. Carries no commercetools customer id: this layer maps the external identity to a customer."
type CilLoginResult @inaccessible {
  "The stable external identity — matched to a customer's externalId."
  externalId: String! @shareable
  email: String @shareable
  firstName: String @shareable
  lastName: String @shareable
  phone: String @shareable
  "An opaque value handed back at revalidation. Sealed into the session, never exposed to the browser."
  anchorToken: String @shareable
  "Anchor lifetime in seconds. Absent means the session's own TTL governs."
  expiresIn: Int @shareable
}

"What this layer asks about when an extension-anchored session refreshes."
input CilRevalidateInput @inaccessible {
  externalId: String!
  anchorToken: String
}

"Whether the session may continue, and optionally a rotated anchor."
type CilRevalidateResult @inaccessible {
  active: Boolean! @shareable
  anchorToken: String @shareable
  expiresIn: Int @shareable
}
