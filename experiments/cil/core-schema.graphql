"""
Monetary amount. Display `formatted`, and calculate with `amount` and
`currencyCode`, never with `formatted`.
"""
type Money @shareable {
  """
  Decimal amount as a string, for example `89.00`. Keeps the full precision of the
  stored amount, so a
  [high-precision](https://docs.commercetools.com/api/types#highprecisionmoney) price
  can have more fraction digits than its currency.
  """
  amount: String!
  """
  Currency code compliant to [ISO 4217](https://en.wikipedia.org/wiki/ISO_4217), for
  example `GBP`.
  """
  currencyCode: String!
  """
  Amount formatted for the session's locale, with the standard number of fraction
  digits of the currency, for example `£89.00`.
  """
  formatted: String!
}

"""Root type of all mutations."""
type Mutation {
  """
  Sets the Shipping Method of the Cart of the current session.
  
  Refused with `EMPTY_CART` if the session has no Cart yet, with
  `SHIPPING_ADDRESS_REQUIRED` if the Cart has no shipping address, and with
  `UNKNOWN_SHIPPING_METHOD` if the Shipping Method doesn't exist or has no rate for
  the Cart.
  """
  selectShippingMethod(
    """The Shipping Method to select."""
    input: SelectShippingMethodInput!
  ): CartMutationResult!
  """
  Removes the Shipping Method from the Cart of the current session. Removing it from a
  Cart without one succeeds and changes nothing.
  
  While a Shipping Method is selected, a shipping address that the method has no rate
  for is refused with `UNKNOWN_SHIPPING_METHOD`. To change to such an address, clear
  the Shipping Method first and select a new one afterwards. An Order can be placed
  without a Shipping Method, see `PlaceOrderInput.shippingMethodId`.
  """
  clearShippingMethod: CartMutationResult!
  """
  Applies a discount code to the Cart of the current session.
  
  Leading and trailing spaces are removed, and the rest is matched exactly, including
  case. A code that doesn't match the Cart is removed again and reported as
  `INVALID_DISCOUNT_CODE`, `DISCOUNT_CODE_EXPIRED`, or
  `DISCOUNT_CODE_NOT_APPLICABLE`. A code that is already on the Cart is refused with
  `DISCOUNT_CODE_ALREADY_APPLIED`. If the session has no Cart yet, the code is
  refused with `EMPTY_CART`.
  """
  applyDiscountCode(
    """Discount code to apply, as the shopper entered it."""
    code: String!
  ): CartMutationResult!
  """
  Remove an entered Discount Code from `discountCodes`, with every `discounts` entry it unlocked; a code not on the cart is a no-op, a blank one `INVALID_INPUT`.
  """
  removeDiscountCode(
    """Discount code to remove, from `DiscountCodeInfo.code`."""
    code: String!
  ): CartMutationResult!
  """
  Adds several Product Variants to the Cart of the current session in one call, for
  example from a quick-order form. Creates the Cart if the session has none.
  
  All lines are added, or none: if one entry is refused, no entry is added.
  """
  addCartLines(
    """
    One entry for each line. A refusal names its entry in `field`, for example
    `inputs.2.sku` or `inputs.2.quantity`.
    """
    inputs: [AddCartLineInput!]!
  ): CartMutationResult!
  """
  Adds a Product Variant to the Cart of the current session. Creates the Cart if the
  session has none.
  
  A refusal is reported in `userErrors`, for example `UNKNOWN_SKU`,
  `NOT_IN_ASSORTMENT`, `PRICE_NOT_AVAILABLE`, or `OUT_OF_STOCK`.
  """
  addCartLine(
    """Line to add."""
    input: AddCartLineInput!
  ): CartMutationResult!
  """Changes the quantity of a line in the Cart of the current session."""
  updateCartLineQuantity(
    """The line and its new quantity."""
    input: UpdateCartLineQuantityInput!
  ): CartMutationResult!
  """
  Sets Custom Fields on a line that is already in the Cart of the current session, for
  example a pickup point chosen later in checkout. To set Custom Fields when you add a
  line, use `addCartLine`.
  
  The `custom` input has the same project-specific shape that `addCartLine` takes.
  Only the fields you pass change: a value replaces the field, `null` clears it, and
  an omitted field keeps its value. Text, number, boolean, enum, and their set types
  can be written. Other field types, such as money, references, and localized enums,
  aren't in the input.
  
  See [Set LineItem
  CustomField](https://docs.commercetools.com/api/projects/carts#set-lineitemcustomfield).
  """
  updateCartLineCustomFields(
    """The line and the values to set."""
    input: UpdateCartLineCustomFieldsInput!
  ): CartMutationResult!
  """Removes a line from the Cart of the current session."""
  removeCartLine(
    """The line to remove."""
    input: RemoveCartLineInput!
  ): CartMutationResult!
  """
  Removes all lines from the Cart of the current session, including custom lines.
  Other data on the Cart, such as addresses, stays.
  """
  clearCart: CartMutationResult!
  """
  Sets the shipping address of the Cart of the current session. Creates the Cart if
  the session has none.
  
  Refused with `SHIPPING_COUNTRY_NOT_SUPPORTED` if the project has no tax rate for
  the country, and with `INVALID_COUNTRY` if `country` isn't a valid ISO 3166-1
  alpha-2 code.
  """
  setShippingAddress(
    """The address to ship to."""
    input: AddressInput!
  ): CartMutationResult!
  """
  Sets the billing address of the Cart of the current session. Creates the Cart if the
  session has none.
  
  Refused with `INVALID_COUNTRY` if `country` isn't a valid ISO 3166-1 alpha-2
  code.
  """
  setBillingAddress(
    """The address to bill."""
    input: AddressInput!
  ): CartMutationResult!
  """
  Sets the email address under which a guest places the Order, on the Cart of the
  current session.
  
  For guest sessions only. A signed-in session is refused with `FORBIDDEN_ACTION`:
  its Order uses the email address of the Customer account. See [Set Customer
  Email](https://docs.commercetools.com/api/projects/carts#set-customer-email).
  """
  setCustomerEmail(
    """The guest's email address."""
    input: SetCustomerEmailInput!
  ): CartMutationResult!
  """Sets the purchase order number of the Cart of the current session."""
  setPurchaseOrderNumber(
    """
    If omitted, `null`, or an empty string, any existing number is removed.
    """
    purchaseOrderNumber: String
  ): CartMutationResult!
  """
  Creates a Shopping List for the signed-in customer.
  
  With a Business Unit selected in the session, the Shopping List belongs to that
  Business Unit and the Store of the session. Without one, it's a personal wishlist. A
  missing associate permission is refused with `FORBIDDEN_ACTION`.
  """
  createShoppingList(
    """The Shopping List to create."""
    input: CreateShoppingListInput!
  ): ShoppingListResult!
  """
  Changes the name or description of a Shopping List.
  
  Refused with `FORBIDDEN_ACTION` unless `availableActions` includes `ADD_LINE`,
  and with `LIST_NOT_FOUND` if the list isn't visible to the session.
  """
  updateShoppingList(
    """The Shopping List and the values to change."""
    input: UpdateShoppingListInput!
  ): ShoppingListResult!
  """
  Adds a Product Variant by SKU to a Shopping List.
  
  Refused with `FORBIDDEN_ACTION` unless `availableActions` includes `ADD_LINE`,
  and with `LIST_NOT_FOUND` if the list isn't visible to the session.
  """
  addShoppingListLine(
    """The line to add."""
    input: AddShoppingListLineInput!
  ): ShoppingListResult!
  """
  Same as `addShoppingListLine`, including its permission check and error codes, but
  takes the values as arguments instead of an input object.
  """
  addToShoppingList(
    """`id` of the Shopping List to add the line to."""
    listId: ID!
    """
    SKU of the Product Variant to add. An unknown SKU is refused with `UNKNOWN_SKU`.
    """
    sku: String!
    """
    Number of items to add. Defaults to `1`. A quantity the platform doesn't accept
    is refused with `INVALID_QUANTITY`.
    """
    quantity: Int! = 1
  ): ShoppingListResult!
  """
  Changes the quantity of a line on a Shopping List.
  
  Refused with `FORBIDDEN_ACTION` unless `availableActions` includes `ADD_LINE`,
  and with `LIST_NOT_FOUND` if the list isn't visible to the session.
  """
  changeShoppingListLineQuantity(
    """The line and its new quantity."""
    input: ChangeShoppingListLineQuantityInput!
  ): ShoppingListResult!
  """
  Removes a line from a Shopping List.
  
  Refused with `FORBIDDEN_ACTION` unless `availableActions` includes
  `REMOVE_LINE`, and with `LIST_NOT_FOUND` if the list isn't visible to the
  session.
  """
  removeShoppingListLine(
    """The line to remove."""
    input: RemoveShoppingListLineInput!
  ): ShoppingListResult!
  """
  Deletes a Shopping List.
  
  Refused with `FORBIDDEN_ACTION` unless `availableActions` includes `DELETE`,
  and with `LIST_NOT_FOUND` if the list isn't visible to the session.
  """
  deleteShoppingList(
    """`id` of the Shopping List to delete."""
    id: ID!
  ): DeleteShoppingListResult!
  """
  Requests a Quote for the Cart of the current session as it is, with its lines,
  addresses, Shipping Method, and prices. To quote something else, change the Cart and
  request again.
  
  The Cart stays active and unchanged. The Quote Request keeps its own copy of the
  lines and totals, so later Cart changes don't affect it.
  
  An empty Cart is refused with `EMPTY_CART`. A Cart without a shipping address is
  refused with `SHIPPING_ADDRESS_REQUIRED`. A Cart with a Discount Code is refused
  with `QUOTE_CART_HAS_DISCOUNT_CODES`.
  """
  requestQuote(
    """Message and purchase order number for the Quote Request."""
    input: RequestQuoteInput!
  ): QuoteRequestResult!
  """
  Cancels a Quote Request that the Buyer no longer wants answered, and sets its state
  to `CANCELLED`.
  
  Only a `SUBMITTED` Quote Request can be cancelled. Other states are refused with
  `QUOTE_REQUEST_NOT_ACTIONABLE`. An unknown ID is refused with
  `QUOTE_REQUEST_NOT_FOUND`.
  """
  cancelQuoteRequest(
    """ID of the Quote Request to cancel."""
    quoteRequestId: ID!
  ): QuoteRequestResult!
  """
  Accepts a Quote and creates an Order from it in the same step. The result returns
  the Order in `order`.
  
  A Quote that isn't `PENDING` is refused with `QUOTE_NOT_ACTIONABLE`, and an
  expired Quote with `QUOTE_EXPIRED`. If the current Associate lacks permission, the
  mutation is refused with `FORBIDDEN_ACTION`. An unknown ID is refused with
  `QUOTE_NOT_FOUND`.
  """
  acceptQuote(
    """ID of the Quote to accept."""
    quoteId: ID!
  ): QuoteResult!
  """
  Declines a Quote and sets its state to `DECLINED`.
  
  Refused on the same terms as `acceptQuote`.
  """
  declineQuote(
    """ID of the Quote to decline."""
    quoteId: ID!
    """
    Reason for declining. Stored as the `buyerComment` of the Quote. A blank value
    is ignored. Passing a reason also requires permission to renegotiate the Quote.
    Without it, the mutation is refused with `FORBIDDEN_ACTION`.
    """
    reason: String
  ): QuoteResult!
  """
  Asks the Seller to renegotiate a Quote. The Quote state changes to
  `DECLINED_FOR_RENEGOTIATION`, and `message` is stored as its `buyerComment`.
  
  Refused on the same terms as `acceptQuote`.
  """
  renegotiateQuote(
    """The Quote to renegotiate and the message to the Seller."""
    input: RenegotiateQuoteInput!
  ): QuoteResult!
  """
  Records the approval of the current Associate on the Approval Flow of an Order. The
  Order itself doesn't change.
  
  An Order without an Approval Flow in the active Business Unit is refused with
  `ORDER_NOT_FOUND`. If the flow can't be approved, the mutation is refused with
  `APPROVAL_NOT_PENDING`, or with `FORBIDDEN_ACTION` if the Associate lacks
  permission.
  """
  approveOrder(
    """ID of the Order to approve."""
    orderId: ID!
  ): ApprovalFlowResult!
  """
  Rejects the Approval Flow of an Order, which ends the flow. The Order is then
  cancelled if its state is `OPEN` or `CONFIRMED`.
  
  Otherwise refused on the same terms as `approveOrder`.
  """
  rejectOrder(
    """ID of the Order to reject."""
    orderId: ID!
    """
    Reason for the rejection. Returned in `rejection.reason` of the Approval Flow. A
    blank value is refused with `APPROVAL_REASON_REQUIRED`.
    """
    reason: String!
  ): ApprovalFlowResult!
  """
  Creates an Approval Rule in the active Business Unit.
  
  The input is checked before the Approval Rule is stored. Invalid conditions are
  refused with `CONDITION_NOT_SUPPORTED`, missing approvers with
  `APPROVER_TIERS_REQUIRED`, and unknown role keys with
  `ASSOCIATE_ROLE_NOT_FOUND`.
  """
  createApprovalRule(
    """The Approval Rule to create."""
    input: CreateApprovalRuleInput!
  ): ApprovalRuleResult!
  """
  Updates an Approval Rule of the active Business Unit. The input is checked the same
  way as for `createApprovalRule`. An unknown ID is refused with
  `APPROVAL_RULE_NOT_FOUND`.
  """
  updateApprovalRule(
    """The Approval Rule to update and the fields to change."""
    input: UpdateApprovalRuleInput!
  ): ApprovalRuleResult!
  """
  Sets the state of an Approval Rule of the active Business Unit to `ACTIVE` or
  `INACTIVE`. An unknown ID is refused with `APPROVAL_RULE_NOT_FOUND`.
  """
  setApprovalRuleActive(
    """ID of the Approval Rule."""
    id: ID!
    """`true` for `ACTIVE`, `false` for `INACTIVE`."""
    active: Boolean!
  ): ApprovalRuleResult!
  """
  Adds the Product lines of an Order to a Cart, at their current Prices and with the
  quantities ordered. Lines that cannot be added are listed in `unavailable`, and
  the other lines are still added.
  
  An Order that does not exist or is not visible to the session is refused with
  `ORDER_NOT_FOUND`.
  """
  reorder(
    """`id` of the Order to reorder."""
    orderId: ID!
    """Where to add the lines."""
    into: ReorderTarget! = ACTIVE_CART
  ): ReorderResult!
  """
  Sets the `orderState` of an Order to `CANCELLED`.
  
  Offered when `Order.availableActions` lists `CANCEL`. An Order that is
  `COMPLETE` or `CANCELLED` is refused with `ORDER_NOT_CANCELLABLE`. A viewer
  without permission to cancel is refused with `FORBIDDEN_ACTION`. An Order that
  does not exist or is not visible to the session is refused with `ORDER_NOT_FOUND`.
  """
  cancelOrder(
    """`id` of the Order to cancel."""
    orderId: ID!
  ): OrderResult!
  """
  Creates a return for items of an Order, in the shipment state `ADVISED`.
  
  Offered when `Order.availableActions` lists `RETURN`. An Order that has not
  shipped is refused with `RETURN_NOT_ALLOWED`. If any line is refused, no return is
  created. An Order that does not exist or is not visible to the session is refused
  with `ORDER_NOT_FOUND`.
  """
  requestReturn(
    """Return to request."""
    input: RequestReturnInput!
  ): ReturnResult!
  """
  Places the Cart of the session as an Order, without a Customer account.
  
  An empty Cart is refused with `EMPTY_CART`. A session with a signed-in Customer is
  refused with `FORBIDDEN_ACTION`. Use `checkout` instead.
  """
  guestCheckout(
    """Details of the Order to place."""
    input: GuestCheckoutInput!
  ): GuestCheckoutResult!
  """
  Places the Cart of the session as an Order, for a signed-in Customer. The Order is
  placed under the Customer's email address.
  
  An empty Cart is refused with `EMPTY_CART`. A session without a signed-in Customer
  is refused with `NOT_AUTHORIZED`.
  """
  checkout(
    """Details of the Order to place."""
    input: CheckoutInput!
  ): CheckoutResult!
  """
  Places the Cart of the session as a B2B Order for the selected Business Unit. The
  result reports whether the Order matched an Approval Rule.
  
  An empty Cart is refused with `EMPTY_CART`. A session without a selected Business
  Unit returns a `BUSINESS_UNIT_REQUIRED` error.
  """
  placeOrder(
    """Details of the Order to place."""
    input: PlaceOrderInput!
  ): PlaceOrderResult!
  """
  Creates a Division under an existing Business Unit. Companies can't be created with
  this API. For how the Division is set up, see `CreateBusinessUnitInput`.
  """
  createBusinessUnit(
    """The Division to create."""
    input: CreateBusinessUnitInput!
  ): BusinessUnitResult!
  """
  Adds an existing Customer as an Associate of the active Business Unit, with the
  given Associate Roles.
  
  Requires the `UPDATE_ASSOCIATES` permission, held directly or inherited. Without
  it, the mutation is refused with `FORBIDDEN_ACTION`, whether or not the email
  address exists. An email address without a Customer account is refused with
  `CUSTOMER_NOT_FOUND`.
  
  The Customer is added without being asked or notified. Unless they hold
  `UPDATE_ASSOCIATES`, they can't leave the Business Unit through this API; an
  Associate who holds it can remove them with `removeAssociate`.
  """
  addAssociate(
    """The Customer to add and the roles to assign."""
    input: AddAssociateInput!
  ): AssociateResult!
  """
  Replaces the Associate Roles that an Associate holds in the Business Unit identified
  by `associateId`. Requires the `UPDATE_ASSOCIATES` permission in that Business
  Unit.
  
  This mutation can remove `UPDATE_ASSOCIATES` from the last Associate who holds it,
  including the current Associate. The Business Unit is then left in the same state
  that `removeAssociate` describes: nobody can manage its Associates through this
  API.
  """
  updateAssociateRoles(
    """The Associate to update and their new roles."""
    input: UpdateAssociateRolesInput!
  ): AssociateResult!
  """
  Removes an Associate, with all their roles, from the Business Unit identified by
  `id`. Requires the `UPDATE_ASSOCIATES` permission in that Business Unit. Without
  it, the mutation is refused with `FORBIDDEN_ACTION`. On success, `associate` is
  `null`.
  
  A Business Unit can end up with no associates at all, because no check ensures that
  anybody remains. If no Associate with `UPDATE_ASSOCIATES` remains, directly or
  inherited, no mutation in this API can add one back. Child units that inherit
  Associates from this Business Unit lose the removed Associate too. Before you remove
  the last administrator, read `BusinessUnit.associates` and assign the roles to
  their replacement.
  """
  removeAssociate(
    """ID of the Associate to remove."""
    id: ID!
  ): AssociateResult!
  """
  Adds an address to the active Business Unit and returns it. Requires the
  `UPDATE_BUSINESS_UNIT_DETAILS` permission. Without it, the mutation is refused
  with `FORBIDDEN_ACTION`.
  """
  addBusinessUnitAddress(
    """The address to add."""
    input: AddressBookInput!
  ): SavedAddressResult!
  """
  Updates an address of the active Business Unit. Stored address fields that the input
  doesn't cover, such as phone numbers, keep their values. An unknown address is
  refused with `ADDRESS_NOT_FOUND`.
  """
  updateBusinessUnitAddress(
    """The address to update and its new values."""
    input: UpdateAddressInput!
  ): SavedAddressResult!
  """
  Removes an address from the active Business Unit. On success, `address` is
  `null`. An unknown address is refused with `ADDRESS_NOT_FOUND`.
  """
  removeBusinessUnitAddress(
    """ID of the address to remove."""
    id: ID!
  ): SavedAddressResult!
  """
  Changes the name of the active Business Unit. Requires the
  `UPDATE_BUSINESS_UNIT_DETAILS` permission. Without it, the mutation is refused
  with `FORBIDDEN_ACTION`.
  """
  changeBusinessUnitName(
    """New name of the Business Unit."""
    name: String!
  ): BusinessUnitResult!
  """
  Sets or removes the contact email address of the active Business Unit. Requires the
  `UPDATE_BUSINESS_UNIT_DETAILS` permission. Without it, the mutation is refused
  with `FORBIDDEN_ACTION`.
  """
  setBusinessUnitContactEmail(
    """
    Email address to set. If omitted or `null`, the current contact email address is
    removed.
    """
    contactEmail: String
  ): BusinessUnitResult!
  """
  Creates a Customer.
  
  It doesn't sign the Customer in. The current session stays valid and anonymous. To
  sign in, call `POST /{project}/main/session` with the `password` grant, which
  also moves the guest Cart to the new Customer.
  """
  register(
    """Customer to create."""
    input: RegisterInput!
  ): CustomerResult!
  """Changes the first name, last name, or both, of the signed-in Customer."""
  updateProfile(
    """Names to change."""
    input: UpdateProfileInput!
  ): CustomerResult!
  """Sets the middle name of the signed-in Customer."""
  setMiddleName(
    """Middle name to set. Pass null to remove the existing value."""
    middleName: String
  ): CustomerResult!
  """Sets the title of the signed-in Customer."""
  setTitle(
    """Title to set. Pass null to remove the existing value."""
    title: String
  ): CustomerResult!
  """Sets the salutation of the signed-in Customer."""
  setSalutation(
    """Salutation to set. Pass null to remove the existing value."""
    salutation: String
  ): CustomerResult!
  """Sets the date of birth of the signed-in Customer."""
  setDateOfBirth(
    """
    Date of birth to set, for example `1990-05-15`. Pass null to remove the existing
    value.
    """
    dateOfBirth: Date
  ): CustomerResult!
  """Sets the company name of the signed-in Customer."""
  setCompanyName(
    """Company name to set. Pass null to remove the existing value."""
    companyName: String
  ): CustomerResult!
  """Sets the individual VAT ID of the signed-in Customer."""
  setVatId(
    """VAT ID to set. Pass null to remove the existing value."""
    vatId: String
  ): CustomerResult!
  """
  Changes the password of the signed-in Customer.
  
  This ends the session. Changing the password invalidates every token issued to the
  Customer, so the next request with this session is rejected. Sign in again with the
  new password.
  """
  changePassword(
    """
    Current password of the Customer. A wrong value returns
    `INVALID_CURRENT_PASSWORD`.
    """
    currentPassword: String!
    """Password to set."""
    newPassword: String!
  ): CustomerResult!
  """
  Changes the email address of the signed-in Customer. Unlike `changePassword`, the
  session stays valid.
  """
  changeEmail(
    """Email change to apply."""
    input: ChangeEmailInput!
  ): CustomerResult!
  """
  Adds an address to the address book of the signed-in Customer. The new address isn't
  marked for shipping or billing.
  
  An unrecognized `country` code returns `SHIPPING_COUNTRY_NOT_SUPPORTED`.
  """
  addAddress(
    """Address to add."""
    input: AddressBookInput!
  ): SavedAddressResult!
  """
  Updates an address in the address book of the signed-in Customer. An `addressId`
  that isn't in the address book returns `ADDRESS_NOT_FOUND`, and an unrecognized
  `country` code returns `SHIPPING_COUNTRY_NOT_SUPPORTED`.
  """
  updateAddress(
    """Address to update and its new values."""
    input: UpdateAddressInput!
  ): SavedAddressResult!
  """
  Removes an address from the address book of the signed-in Customer. An `id` that
  isn't in the address book returns `ADDRESS_NOT_FOUND`.
  """
  removeAddress(
    """`id` of the SavedAddress to remove."""
    id: ID!
  ): SavedAddressResult!
  """
  Makes an address the default shipping or billing address of the signed-in Customer
  and marks it for that use. An `addressId` that isn't in the address book returns
  `ADDRESS_NOT_FOUND`.
  """
  setDefaultAddress(
    """`id` of the SavedAddress to make the default."""
    addressId: ID!
    """
    Whether to make it the default shipping or the default billing address.
    """
    use: AddressUse!
  ): SavedAddressResult!
  """
  Starts payment with [Checkout](https://docs.commercetools.com/checkout/overview) for
  the Cart of the current session. Checkout authorizes the payment and creates the
  Order.
  
  Call it when the shopper reaches checkout, because the Checkout Session expires.
  Each call creates a new Checkout Session, so call it again when you remount the
  flow. Refused with `EMPTY_CART` if the Cart has no lines, and with
  `CHECKOUT_NOT_CONFIGURED` if no Checkout configuration of the project matches the
  session's country and Store.
  """
  beginPayment: BeginPaymentResult!
}

"""Object that the `node` query can fetch again by its `id`."""
interface Node {
  """
  Globally unique identifier of the object. Treat it as an opaque string and don't
  parse it.
  """
  id: ID!
}

enum OccasionEnum {
  birthday
  thankyou
  housewarming
  holiday
  discovery
}

"""
Purchase placed from a Cart, as returned by `order` and by the mutations that place
or change it. `availableActions` lists what the viewer can do with it next.
"""
type Order implements Node {
  """Unique identifier of the Order."""
  id: ID!
  """User-defined identifier of the Order. `null` when none is assigned."""
  orderNumber: String
  """
  Reference to show to the shopper: `orderNumber` when set, otherwise the Order's
  platform identifier.
  """
  reference: String!
  """
  Purchase order number of the buyer, as passed to `placeOrder`. `null` when none
  was given.
  """
  purchaseOrderNumber: String
  """Origin of the Order."""
  origin: OrderOrigin!
  """Whether the Order was created from a Quote."""
  fromQuote: Boolean!
  """Date and time (UTC) the Order was created."""
  placedAt: DateTime!
  """
  Date and time (UTC) the Order was completed. `null` when none is recorded.
  """
  completedAt: DateTime
  """Date and time (UTC) the Order was last updated."""
  lastModifiedAt: DateTime!
  """
  Customer who placed the Order. `null` for a guest Order. For an Order outside a
  Business Unit, or from someone who is no longer an Associate of it, the Associate
  has no name and no roles.
  """
  placedBy: Associate
  """Business Unit the Order belongs to. `null` for a B2C Order."""
  businessUnit: BusinessUnit
  """Store the Order belongs to. `null` when the Order belongs to no Store."""
  store: Store
  """State of the Order."""
  orderState: OrderState!
  """Shipment state of the Order. `null` when none is set."""
  shipmentState: ShipmentState
  """Payment state of the Order. `null` when none is set."""
  paymentState: PaymentState
  """
  State of the Order in the merchant's workflow. `null` when none is set.
  """
  state: OrderWorkflowState
  """
  Email address the Order was placed under. Empty when the Order has none.
  """
  email: String!
  """Lines of the Order."""
  lines: [OrderLine!]!
  """
  Every discount applied when the order was placed, one entry per discount and target, its `amount` summed over the order: Product Discounts included, except where a Best Deal rejected them. The non-SHIPPING entries add up to `totals.discountTotal`.
  """
  discounts: [AppliedDiscount!]!
  """How Product Discounts and Cart Discounts were combined on this order."""
  discountCombination: DiscountCombination!
  """The Discount Codes the order was placed with, and where each stands."""
  discountCodes: [DiscountCodeInfo!]!
  """Totals of the Order."""
  totals: PriceTotals!
  """Address the Order is shipped to."""
  shippingAddress: Address!
  """Address the Order is billed to."""
  billingAddress: Address!
  """Returns of the Order. Empty when nothing has been returned."""
  returns: [Return!]!
  """
  Deliveries of the Order, in the order the platform stores them: first those of the
  Order's shipping, then those of each additional Shipping Method. Empty until the
  merchant records one.
  """
  deliveries: [Delivery!]!
  """
  Approval Flow that the Order started when it was placed. `null` when the Order
  needs no approval.
  """
  approvalFlow: ApprovalFlow
  """Actions the current viewer can take on the Order now."""
  availableActions: [OrderAction!]!
  """
  Platform identifier (UUID) of the Order, for extensions that correlate the Order
  with a fulfillment or accounting system. The public `id` is an opaque global
  identifier, so don't parse it.
  
  Not part of the public API: an extension can read it with `@requires`, and it is
  removed from the composed API schema.
  """
  _ctId: ID! @inaccessible
  custom: OrderCustom
}

"""
Action on an Order, as listed in `availableActions`. Resolved from the Order's
state, the quantities still returnable, and, for a B2B Order, the viewer's Associate
permissions.
"""
enum OrderAction {
  """
  Add the Order's lines to a Cart with `reorder`. Offered when the Order has lines.
  Only Product lines are reordered, not custom lines.
  """
  REORDER
  """
  Return items with `requestReturn`. Offered when the Order is not canceled, is
  `COMPLETE` or has the shipment state `SHIPPED`, `DELIVERED`, or `PARTIAL`,
  and has units left to return.
  """
  RETURN
  """
  Cancel the Order with `cancelOrder`. Offered when the Order is `OPEN` or
  `CONFIRMED` and, for a B2B Order, the viewer has permission to update it.
  """
  CANCEL
}

"""
Approval outcome reported by `placeOrder`. Afterward, read the Approval Flow on
`Order.approvalFlow`.
"""
type OrderApproval {
  """
  Whether the Order matched an [Approval
  Rule](https://docs.commercetools.com/api/projects/approval-rules) when it was
  created, so an Approval Flow was created for it.
  """
  required: Boolean!
  """Current state of the Approval Flow."""
  approvalState: ApprovalState
  """`id` of the Approval Flow."""
  flowId: ID
  """Associate Roles the Approval Flow is waiting on in its current tier."""
  currentTierPendingApproverRoles: [AssociateRole!]!
}

"""Page of order history returned by `orders`."""
type OrderConnection {
  """Orders on this page, with their cursors."""
  edges: [OrderEdge!]!
  """Orders on this page, in the same order as `edges`."""
  nodes: [OrderListItem!]!
  """Pagination information of this page."""
  pageInfo: PageInfo!
  """Total number of Orders that match the filter, across all pages."""
  totalCount: Int!
}

union OrderCustom = InstoreOrderTypeCustom

"""Edge in an OrderConnection."""
type OrderEdge {
  """The Order, as an order history row."""
  node: OrderListItem!
  """Opaque cursor of this edge. Pass it as `after` to get the next page."""
  cursor: String!
}

"""Filter for `orders`. All set fields must match."""
input OrderFilter {
  """
  Exact value to match against the Order's `reference`, `orderNumber`,
  `purchaseOrderNumber`, or the SKU of one of its lines. Partial values do not
  match.
  """
  query: String
  """Order states to match. An Order matches if it is in any of them."""
  orderState: [OrderState!]
  """Matches Orders created after this date and time."""
  placedAfter: DateTime
  """Matches Orders created before this date and time."""
  placedBefore: DateTime
}

"""Line of an Order as it was placed, with the units shipped so far."""
type OrderLine implements Node {
  """
  Unique identifier of the Order line. Pass it as `ReturnLineInput.lineId` to return
  units of it.
  """
  id: ID!
  """
  SKU of the Product Variant. Empty for a line that has no Product, such as a custom
  line.
  """
  sku: String!
  """Name of the Product in the session's locale."""
  productName: String!
  """
  URL of the first image of the Product Variant. `null` when the variant has no
  image.
  """
  imageUrl: Url
  """Number of units ordered."""
  quantity: Int!
  """
  Number of units recorded as shipped, across all deliveries of the Order. Not set on
  custom lines, so selecting this field on an Order that has a custom line returns an
  error.
  """
  shippedQuantity: Int!
  """
  Number of units still to ship: `quantity` minus `shippedQuantity`, and never
  less than zero. Not set on custom lines, so selecting this field on an Order that
  has a custom line returns an error.
  """
  outstandingQuantity: Int!
  """
  What this Line Item cost after every discount: its Portions' `unitPrice` times `quantity`, added up. On an `EXTERNAL_TOTAL` Line Item it is the total the external system set instead.
  """
  lineTotal: Money!
  """
  Whether this is a free Gift Line Item the platform added. Its Portion lists the gift discount that added it, which carries the same `id` as that discount's entry in `discounts`.
  """
  isGift: Boolean!
  """
  One unit before any discount, as the order was placed: the Line Item's price.
  """
  unitPriceBeforeDiscount: Money!
  """How the Line Item's price was set; null for a custom line."""
  priceMode: LinePriceMode
  """
  One unit after its Product Discount, and the Product Discount behind it; null when none applied. Kept where a Best Deal rejected it: see `rejectedByBestDeal`.
  """
  discountedPrice: LineItemDiscountedPrice
  """
  The Line Item's units grouped by what they cost after Cart Discounts; at least one.
  """
  portions: [Portion!]!
  custom: LineItemCustom
}

"""
Summary of an Order for order history. For the full Order, query `order`.
"""
type OrderListItem {
  """Unique identifier of the Order. Accepted by `order(id:)`."""
  id: ID!
  """User-defined identifier of the Order. `null` when none is assigned."""
  orderNumber: String
  """
  Reference to show to the shopper: `orderNumber` when set, otherwise the Order's
  platform identifier.
  """
  reference: String!
  """Origin of the Order."""
  origin: OrderOrigin!
  """Whether the Order was created from a Quote."""
  fromQuote: Boolean!
  """Date and time (UTC) the Order was created."""
  placedAt: DateTime!
  """State of the Order."""
  orderState: OrderState!
  """Shipment state of the Order. `null` when none is set."""
  shipmentState: ShipmentState
  """Payment state of the Order. `null` when none is set."""
  paymentState: PaymentState
  """Business Unit the Order belongs to. `null` for a B2C Order."""
  businessUnit: BusinessUnit
  """
  Total charged for the Order, including tax. Same amount as
  `Order.totals.grandTotal`.
  """
  total: Money!
  """
  Actions the current viewer can take on the Order now. Same as
  `Order.availableActions`.
  """
  availableActions: [OrderAction!]!
}

"""
Who or what placed the Order. To find out whether the Order was created from a Quote,
read `Order.fromQuote`.
"""
enum OrderOrigin {
  """Placed by the shopper."""
  CUSTOMER
  """Placed on the shopper's behalf, by a sales representative or agent."""
  MERCHANT
  """Placed from a quotation Cart."""
  QUOTE
  """Placed as an instalment of a recurring Order."""
  RECURRING_ORDER
}

"""Result of `cancelOrder`."""
type OrderResult {
  """
  The Order after the mutation. When the cancellation is refused for the Order's state
  or the viewer's permissions, this is the unchanged Order. `null` when the Order
  isn't found, and when the platform refuses the write after those checks, which is
  returned as `FORBIDDEN_ACTION` or `ORDER_NOT_CANCELLABLE`.
  """
  order: Order
  """Refusals of the cancellation. Empty when the Order was canceled."""
  userErrors: [UserError!]!
}

"""Sort order for `orders`."""
input OrderSort {
  """Field to sort by."""
  field: OrderSortField! = PLACED_AT
  """Direction to sort in."""
  direction: SortDirection! = DESC
}

"""Order attribute that `orders` can sort by."""
enum OrderSortField {
  """Sort by the date and time the Order was created."""
  PLACED_AT
  """
  Sort by the total price of the Order. Where prices exclude tax, this is the total
  before tax, so the order can differ from `OrderListItem.total`, which includes
  tax.
  """
  TOTAL
  """Sort by `orderNumber`."""
  ORDER_NUMBER
}

"""
Lifecycle state of an Order. Shipping and payment progress are tracked separately in
`ShipmentState` and `PaymentState`.
"""
enum OrderState {
  """Default state of a new Order."""
  OPEN
  """The Order is accepted and being processed."""
  CONFIRMED
  """The Order is fulfilled."""
  COMPLETE
  """The Order is canceled."""
  CANCELLED
}

enum OrderTypeEnum {
  normal
  instorepurchase
  instorereturn
  instoreexchange
  online
}

"""
Custom state from the merchant's
[State](https://docs.commercetools.com/api/projects/states) workflow, independent of
`orderState`.
"""
type OrderWorkflowState {
  """User-defined unique identifier of the State."""
  key: String!
  """Name of the State in the session's locale."""
  name: String!
}

"""Paging state returned with each page of a cursor-paginated list."""
type PageInfo @shareable {
  """
  Whether more items follow the current page. `false` once the page reaches the
  deepest item the list can page to, even when `totalCount` is higher.
  """
  hasNextPage: Boolean!
  """Whether items precede the current page."""
  hasPreviousPage: Boolean!
  """Cursor of the first item on the page. `null` if the page is empty."""
  startCursor: String
  """
  Cursor of the last item on the page. Pass it as `after` to fetch the next page.
  `null` if the page is empty.
  """
  endCursor: String
}

"""Physical package of a Delivery."""
type Parcel {
  """Date and time (UTC) the Parcel was created."""
  recordedAt: DateTime!
  """Identifier to track the Parcel. `null` when none is recorded."""
  trackingId: String
  """
  Name of the carrier that delivers the Parcel. `null` when none is recorded.
  """
  carrier: String
  """
  Whether the Parcel is being returned to the merchant. `null` when not recorded.
  """
  isReturn: Boolean
  """
  Units in the Parcel. Empty when the delivery lists its contents instead.
  """
  lines: [DeliveryLine!]!
}

union PaymentCustom = InstorePaymentTypeCustom | PaymentLaunchpadPurchaseOrderCustom

"""Payment method to attach to the Order at checkout."""
input PaymentInput {
  """
  `key` of the payment method, as returned by `paymentMethods`. An unknown key is
  refused with `UNKNOWN_PAYMENT_METHOD`.
  """
  methodKey: String!
}

type PaymentLaunchpadPurchaseOrderCustom {
  customTypeKey: String!
  customTypeId: ID!
  launchpadPurchaseOrderNumber: String
  launchpadPurchaseOrderInvoiceMemo: String
}

input PaymentLaunchpadPurchaseOrderCustomInput {
  launchpadPurchaseOrderNumber: String
  launchpadPurchaseOrderInvoiceMemo: String
}

"""A payment method the shopper can choose at checkout."""
type PaymentMethodOption {
  """
  User-defined unique identifier of the payment method. Pass it as
  `PaymentInput.methodKey` to pay with this method.
  """
  key: String!
  """
  Name of the payment method in the session's locale. Empty string if the payment
  method has no name in that locale.
  """
  label: String!
}

"""Payment progress of an Order."""
enum PaymentState {
  """Payment for the Order is pending."""
  PENDING
  """The Order is paid for."""
  PAID
  """Payment for the Order has failed."""
  FAILED
  """Payment for the Order is made on a credit basis."""
  CREDIT_OWED
  """A payment balance is due for the Order."""
  BALANCE_DUE
}

"""Order details for a B2B checkout. Every field is optional."""
input PlaceOrderInput {
  """Purchase order number of the buyer, stored on the Order."""
  purchaseOrderNumber: String
  """
  `id` of a SavedAddress in the Business Unit's or the Associate's address book to
  ship to. If omitted or blank, the shipping address already on the Cart is used.
  
  An `id` that matches no saved address is refused with `ADDRESS_NOT_FOUND`. So is
  an omitted `id` when the Cart has no shipping address.
  """
  shippingAddressId: ID
  """
  `id` of a SavedAddress in the Business Unit's or the Associate's address book to
  bill to. If omitted, the billing address on the Cart is used, or the shipping
  address when the Cart has none. An `id` that matches no saved address is refused
  with `ADDRESS_NOT_FOUND`.
  """
  billingAddressId: ID
  """
  `id` of the Shipping Method to set on the Cart before the Order is created. If
  omitted or blank, the Cart keeps the Shipping Method it already has, if any. An
  unusable Shipping Method is refused with `UNKNOWN_SHIPPING_METHOD`.
  
  An Order placed without a Shipping Method has no `totals.shipping` and its total
  covers the lines only. A Shipping Method cannot be added to the Order afterward.
  """
  shippingMethodId: ID
  """
  Payment for the Order. If omitted, the Order is placed with no payment attached.
  """
  payment: PaymentInput
}

"""Result of `placeOrder`."""
type PlaceOrderResult {
  """The placed Order. `null` when `userErrors` is not empty."""
  order: Order
  """
  Approval outcome of the placed Order. `null` when the Order needs no approval.
  
  If the Approval Flow cannot be looked up, this field returns a GraphQL error with
  the code `APPROVAL_STATE_UNKNOWN`, and `order` is still returned.
  """
  approval: OrderApproval
  """Refusals of the order placement. Empty when the Order was placed."""
  userErrors: [UserError!]!
}

"""
Units of one Line Item that cost the same after Cart Discounts: one entry of the platform's `discountedPricePerQuantity`. Every Line Item has at least one; an `EXTERNAL_TOTAL` Line Item has exactly one, of every unit at its external unit price.
"""
type Portion {
  """How many of the Line Item's units are in this Portion."""
  quantity: Int!
  """What one of these units costs after every discount applied to it."""
  unitPrice: Money!
  """
  The Cart Discounts and Direct Discounts that reduced these units, each `amount` per unit; empty when none did. Product Discounts are never listed here: see the Line Item's `discountedPrice`.
  """
  discounts: [AppliedDiscount!]!
}

"""
Values for a language, country, or currency selector. The values the session currently
uses are in `Viewer.locale` and `Viewer.currency`. Change them with `PATCH
/{project}/main/session`, which issues a new session token and accepts only values
from these lists.
"""
type PresentmentOptions {
  """Languages of the project, as IETF language tags."""
  languages: [String!]!
  """Countries of the project, as ISO 3166-1 alpha-2 codes."""
  countries: [String!]!
  """
  Currencies of the project, as ISO 4217 codes. Not limited to the currencies that the
  active Store has prices in. See `Viewer.currency` for what happens without a
  price.
  """
  currencies: [String!]!
}

"""
A volume price of a Product Variant. From `minimumQuantity` units on a Cart line,
each unit costs `price`.
"""
type PriceTier {
  """
  Minimum quantity this price tier is valid for. Always 2 or greater, since a single
  unit costs the variant's `price`.
  """
  minimumQuantity: Int!
  """Price of one unit at this quantity, not the line total."""
  price: Money!
}

"""
Money figures of a Cart, Order, or Quote, from the subtotal of the lines to the grand
total that the shopper pays.
"""
type PriceTotals {
  """
  Every Line Item's `unitPriceBeforeDiscount` times its `quantity`, added up, with an `EXTERNAL_TOTAL` Line Item counted at its `lineTotal`: before any discount.
  """
  subtotal: Money!
  """
  What the applied discounts take off the goods, Product Discounts included and SHIPPING discounts excluded: the sum of the other entries in `discounts`; null when none. Each `lineTotal` already reflects it, except for `TOTAL_PRICE` discounts.
  """
  discountTotal: Money
  """
  What delivery costs, across every shipment, after any SHIPPING discount; null if no Shipping Method is selected.
  """
  shipping: Money
  """
  Total tax amount, already included in `grandTotal`. `null` until tax is
  calculated, for example before a shipping address is set.
  """
  tax: Money
  """
  Total amount the shopper pays, including tax once tax is calculated. Display this as
  the total, and charge this amount.
  
  Before tax is calculated, this is the total of the lines and shipping after
  discounts.
  """
  grandTotal: Money!
  """
  Total amount without tax. Equals `grandTotal` until tax is calculated. Use it in a
  summary that lists tax on its own line.
  """
  grandTotalNet: Money!
}

"""
A Product in the Store's assortment.

Each Project adds an `attributes` field to `Product` and `ProductVariant`,
generated from its Product Types. It returns the `ProductAttributes` or
`ProductVariantAttributes` interface, with one implementing
`<ProductType>Attributes` type per Product Type, and a `raw` JSON map of the
attribute values.
"""
type Product implements Node {
  """Unique identifier of the Product."""
  id: ID!
  """
  Platform identifier (UUID) of the Product, for extensions that key an external
  system by it. The public `id` is an opaque global identifier, so don't parse it.
  Not part of the public API: an extension can read it with `@requires`, and it's
  removed from the composed API schema.
  """
  _ctId: ID! @inaccessible
  """Categories assigned to the Product."""
  categories: [Category!]!
  """User-defined unique identifier of the Product."""
  key: String
  """
  User-defined identifier used in a deep-link URL for the Product, for the session's
  locale.
  """
  slug: String!
  """Name of the Product, for the session's locale."""
  productName: String!
  """
  Description of the Product, for the session's locale. Null when the Product has no
  description.
  """
  description: String
  """Images of the default variant."""
  images: [Image!]!
  """
  Inventory of the default variant, counted as described on
  `ProductVariant.availability`.
  """
  availability: Availability!
  """
  Axes on which the Product's variants differ, for rendering a variant picker. Empty
  when the variants don't differ on any selectable attribute.
  """
  options: [ProductOption!]!
  """
  Variants of the Product, starting with the default variant. Variants without a SKU
  are left out.
  """
  variants: [ProductVariant!]!
  """
  Default variant of the Product. This is the master variant, or the first variant
  with a SKU when the master variant has none.
  """
  defaultVariant: ProductVariant
  """
  Variants that matched the `query` or `filter` of `Query.search` or
  `Query.products`. Null when the Product was read another way.
  """
  matchingVariants: [ProductVariant!]
  """
  Labels for the Product's attributes. Use them to label attribute rows without
  selecting a specific Product Type.
  """
  attributeLabels: [AttributeLabel!]!
  """
  This product type's attributes, typed, plus a `raw` untyped map. Null when its product type declares no attributes at this level. Display labels are `Product.attributeLabels`.
  """
  attributes: ProductAttributes
  """
  Price of the default variant, resolved as described on `ProductVariant.price`.
  
  `null` when the session isn't entitled to a price, or the default variant has no
  price in the session's currency or country. `addCartLine` refuses such a variant
  with `PRICE_NOT_AVAILABLE`. Other variants can still have a price, so check
  `variants`.
  """
  price: Money
  """The price before its Product Discount: the strike-through price."""
  priceBeforeDiscount: Money
  """
  The default variant's price after its Product Discount, and the Product Discount behind it; null when no Product Discount applies. `price` then equals `discountedPrice.value`.
  """
  discountedPrice: DiscountedPrice
  """
  All [Standalone
  Prices](https://docs.commercetools.com/api/projects/standalone-prices) of the
  Product's variants, for extensions, including inactive prices and prices for other
  scopes. Storefronts read `ProductVariant.price`. Not part of the public API: an
  extension can read it with `@requires`, and it's removed from the composed API
  schema.
  """
  _standalonePrices: [InternalStandalonePrice!]! @inaccessible
}

interface ProductAttributes {
  productTypeKey: String!
  productTypeId: ID!
  """
  This product type's attribute values at this level, untyped, as a JSON map keyed by attribute name. For generic rendering and for attribute types the typed fields cannot express; prefer the typed fields. Display names are on Product.attributeLabels.
  """
  raw: JSON
}

"""A page of Products returned by `Query.products`."""
type ProductConnection {
  """Products on this page, with their cursors."""
  edges: [ProductEdge!]!
  """Products on this page, in the same order as `edges`."""
  nodes: [Product!]!
  """Pagination information for this page."""
  pageInfo: PageInfo!
  """Total number of Products that match the request, across all pages."""
  totalCount: Int!
}

"""The Product Discount behind a discounted price."""
type ProductDiscountInfo {
  """
  Opaque id of the Product Discount, the same as the `AppliedDiscount.id` it has in a cart's `discounts`. Clients never parse it.
  """
  id: ID!
  """The merchant's key for the Product Discount, where one is set."""
  key: String
  """
  The Product Discount's name in the session's locale; null where it has none for that locale.
  """
  name: String
  """How it reduces; null once the Product Discount is deleted."""
  valueType: DiscountValueType
}

"""Edge of a `ProductConnection` or `ProductSearchConnection`."""
type ProductEdge @shareable {
  """Product at this position in the list."""
  node: Product!
  """
  Opaque cursor of this Product. Pass it as `after` to get the Products that follow
  it.
  """
  cursor: String!
}

"""
Conditions on a Product list or search. Each field you set narrows the result further.
A `categorySlug` that matches no Category, or an attribute `code` the Project
can't filter on, returns an empty page.
"""
input ProductFilter {
  """
  Slug of a Category for the session's locale. Returns only Products assigned to that
  Category.
  """
  categorySlug: String
  """
  Whether to return only Products with a discounted price for the session (`true`),
  or only Products without one (`false`). Decided per variant, like `priceMin`:
  `true` can return a Product whose `Product.price` isn't discounted, and
  `false` can return a Product that has a discounted variant.
  """
  onSale: Boolean
  """
  Lowest price to include, in major units of the session's currency, for example
  `50` for £50.00. Discounted prices are compared per variant, as described on
  `ProductSortField.PRICE`, so a Product can match while `Product.price` is
  outside the range.
  """
  priceMin: Float
  """
  Highest price to include, in major units of the session's currency. Compared like
  `priceMin`.
  """
  priceMax: Float
  """
  Filters on the Product's attributes. Accepts any value of the attribute, including
  values that `Facet.options` doesn't list.
  
  Also accepts the Project's searchable text attributes, which have no facet. A
  localized text attribute is matched on its value for the session's locale.
  """
  attributes: [AttributeFilterInput!]
  """
  Numeric range filters on the Product's attributes, by the same `code` as
  `attributes`.
  """
  attributeRanges: [AttributeRangeFilterInput!]
}

"""
A variant selection axis of a Product, such as color or size.

An axis is a variant-level attribute of type text, localized text, enum, localized
enum, number, or boolean whose value differs across the Product's variants. A Product
with one variant has no axes. When several attributes vary, each one is reported as
its own axis, so choose the `code` values you want to render.
"""
type ProductOption {
  """Name of the attribute behind this axis."""
  code: String!
  """
  Display label of the attribute for the session's locale. Falls back to `code` when
  the attribute definition has no label for that locale.
  """
  label: String!
  """
  Distinct values of the attribute across the Product's variants, in the order in
  which the variants first use them.
  """
  values: [ProductOptionValue!]!
}

"""
A value a shopper can pick on a `ProductOption` axis. A variant has this value when
its `SelectedOption` with the same `code` has the same `value`.
"""
type ProductOptionValue {
  """
  Attribute value as stored, such as an enum key, or localized text resolved for the
  session's locale.
  """
  value: String!
  """
  Display label of the value for the session's locale. Falls back to `value` when
  the value has no label.
  """
  label: String!
}

"""
A page of `Query.search` results. Same as `ProductConnection`, plus `facets`.
"""
type ProductSearchConnection {
  """Products on this page, with their cursors."""
  edges: [ProductEdge!]!
  """Products on this page, in the same order as `edges`."""
  nodes: [Product!]!
  """Pagination information for this page."""
  pageInfo: PageInfo!
  """Total number of Products that match the search, across all pages."""
  totalCount: Int!
  """Facets of the search result."""
  facets: [Facet!]!
}

"""
Sort order for `Query.products` and `Query.search`.

Omitting `sort`, passing `sort: {}`, and passing `sort: {field: RELEVANCE}`
return the same order. Products that sort equally are always returned in the same
order, so paging doesn't repeat or skip a Product.
"""
input ProductSort {
  """Field to sort by. Defaults to `RELEVANCE`."""
  field: ProductSortField! = RELEVANCE
  """
  Direction of the sort. Omit it to use the default direction of `field`, listed on
  each `ProductSortField` value. Set it only to reverse that default.
  """
  direction: SortDirection
}

"""Sort key of `ProductSort`. Each value has its own default direction."""
enum ProductSortField {
  """Relevance to the search `query`. Most relevant first by default."""
  RELEVANCE
  """
  Price for the session. Cheapest first by default, and `direction: DESC` reverses
  it.
  
  Ascending order uses each Product's cheapest variant price, and descending order its
  most expensive one. This can differ from `Product.price`, which is the price of
  the DEFAULT variant, so a Product's position may not match the price it shows. To
  show the prices a Product was ranked on, select `variants { price }`.
  `ProductFilter.priceMin` and `ProductFilter.priceMax` use the same per-variant
  rule.
  """
  PRICE
  """Product name for the session's locale. A to Z by default."""
  NAME
  """Creation date of the Product. Newest first by default."""
  NEWEST
}

"""
A purchasable version of a Product, such as one combination of size and color.
"""
type ProductVariant implements Node {
  """Unique identifier of the Product Variant. Unique across all Products."""
  id: ID!
  """
  SKU of the Product Variant. Unique across all Product Variants in a Project. Pass it
  to `addCartLine` to add the variant to the Cart.
  """
  sku: String!
  """
  Values of this variant on the axes in `Product.options`. Axes for which the
  variant has no value are left out.
  """
  selectedOptions: [SelectedOption!]!
  """
  Inventory of the variant for the session's supply channel. Without a supply channel,
  the stock of all supply channels is added up.
  """
  availability: Availability!
  """Images of the Product Variant."""
  images: [Image!]!
  """
  Assets of the Product Variant, such as documents, videos, or 3D models. Empty when the
  variant has no Assets, or none matches `tags`.
  """
  assets(
    """
    Tags to match, as listed in `Asset.tags`. An Asset matches when it has any of them,
    compared case-sensitively. An empty list applies no filter.
    """
    tags: [String!]
  ): [Asset!]!
  """
  This product type's attributes, typed, plus a `raw` untyped map. Null when its product type declares no attributes at this level. Display labels are `Product.attributeLabels`.
  """
  attributes: ProductVariantAttributes
  """
  Price of the variant for the session's currency, country, distribution channel, and
  Customer Group, with any Product Discount applied.
  
  `null` if the session isn't entitled to a price, if the variant has no price for
  the session's currency or country, or if the Store has no prices in the session's
  currency. Adding such a variant with `addCartLine` returns
  `PRICE_NOT_AVAILABLE`.
  """
  price: Money
  """The price before its Product Discount: the strike-through price."""
  priceBeforeDiscount: Money
  """
  The price after its Product Discount, and the Product Discount behind it; null when no Product Discount applies. `price` then equals `discountedPrice.value`.
  """
  discountedPrice: DiscountedPrice
  """
  Price tiers of `price`, lowest `minimumQuantity` first. Empty when the price has
  no tiers or the variant has no price.
  """
  priceTiers: [PriceTier!]!
}

interface ProductVariantAttributes {
  productTypeKey: String!
  productTypeId: ID!
  """
  This product type's attribute values at this level, untyped, as a JSON map keyed by attribute name. For generic rendering and for attribute types the typed fields cannot express; prefer the typed fields. Display names are on Product.attributeLabels.
  """
  raw: JSON
}

"""Root type of all queries."""
type Query {
  """
  Returns the Approval Flows of the active Business Unit that the current Associate
  can view.
  
  Requires an active Business Unit. Without one, the query fails with a
  `BUSINESS_UNIT_REQUIRED` error.
  """
  approvals(
    """Filters the Approval Flows."""
    filter: ApprovalFlowFilter
    """Maximum number of results to return, from `0` to `500`. Default: `20`."""
    first: Int! = 20
    """
    Cursor of the item after which the page starts. Take it from `edges.cursor` or
    `pageInfo.endCursor`. A cursor that this API didn't issue, or one past the
    10,000th item, fails the query.
    """
    after: String
  ): ApprovalFlowConnection!
  """
  Returns an Approval Flow of the active Business Unit. Returns `null` if it doesn't
  exist or the current Associate can't view it.
  
  Requires an active Business Unit. Without one, the query fails with a
  `BUSINESS_UNIT_REQUIRED` error.
  """
  approval(
    """ID of the Approval Flow."""
    id: ID!
  ): ApprovalFlow
  """
  Returns the Approval Rules of the active Business Unit.
  
  Requires an active Business Unit. Without one, the query fails with a
  `BUSINESS_UNIT_REQUIRED` error.
  """
  approvalRules(
    """Filters the Approval Rules."""
    filter: ApprovalRuleFilter
    """Maximum number of results to return, from `0` to `500`. Default: `20`."""
    first: Int! = 20
    """
    Cursor of the item after which the page starts. Take it from `edges.cursor` or
    `pageInfo.endCursor`. A cursor that this API didn't issue, or one past the
    10,000th item, fails the query.
    """
    after: String
