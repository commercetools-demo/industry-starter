"""
One [Standalone Price](https://docs.commercetools.com/api/projects/standalone-prices)
of a Product Variant, as returned to extensions by `Product._standalonePrices`.
The raw price, with no [price
selection](https://docs.commercetools.com/api/pricing-and-discounts-overview#fallback-logic)
applied: the list includes inactive prices and prices for every scope, and choosing
among them follows the platform's fallback order, not an exact match on the scope
fields.
"""
type InternalStandalonePrice @inaccessible {
  """SKU of the Product Variant the price applies to."""
  sku: String!
  """
  Identifier of the distribution Channel the price is scoped to. Null when the price
  has no Channel.
  """
  channelId: ID
  """
  Key of the distribution Channel the price is scoped to. Null when the price has no
  Channel or the Channel has no key.
  """
  channelKey: String
  """
  Amount in the smallest indivisible unit of the currency, such as cents for EUR and
  USD, or pence for GBP.
  """
  centAmount: Int!
  """Currency code compliant to ISO 4217."""
  currencyCode: String!
  """
  Whether the price is active. An inactive price is not considered during price
  selection.
  """
  active: Boolean!
  """
  Country the price is scoped to, as an ISO 3166-1 alpha-2 code. Null when the price
  applies in every country.
  """
  country: String
  """
  Identifier of the Customer Group the price is scoped to. Null when the price applies
  to every Customer Group.
  """
  customerGroupId: ID
  """
  Key of the Customer Group the price is scoped to. Null when the price has no Customer
  Group or the Customer Group has no key.
  """
  customerGroupKey: String
  """
  Date and time from which the price is valid. Null when it has no start.
  """
  validFrom: DateTime
  """Date and time until which the price is valid. Null when it has no end."""
  validUntil: DateTime
  """
  Amount after the Product Discount that applies to the price, in the smallest
  indivisible unit of the currency. Null when no Product Discount applies.
  """
  discountedCentAmount: Int
  """
  Identifier of the Product Discount behind `discountedCentAmount`. Null when none applies.
  """
  productDiscountId: ID
  """
  Volume prices of the price, as on the platform. Empty when the price has no tiers.
  The platform ignores them when `discountedCentAmount` is set.
  """
  tiers: [InternalStandalonePriceTier!]!
}

"""
A volume price of an `InternalStandalonePrice`. From `minimumQuantity` units, each
unit costs `centAmount` in the price's currency.
"""
type InternalStandalonePriceTier @inaccessible {
  """Minimum quantity this price tier is valid for."""
  minimumQuantity: Int!
  """
  Price of one unit at this quantity, in the smallest indivisible unit of the currency.
  """
  centAmount: Int!
}

