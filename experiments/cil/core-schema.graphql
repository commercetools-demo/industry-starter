  `setPurchaseOrderNumber`. `null` if not set.
  """
  purchaseOrderNumber: String
  """Origin of the Cart."""
  origin: CartOrigin!
  """Shipping Method selected for the Cart. `null` if none is selected."""
  shippingMethod: ShippingMethod
  """
  What the current viewer can do with this Cart, to show or hide the matching
  controls. Empty if the Cart has no lines.
  """
  availableActions: [CartAction!]!
  """
  Platform `id` of the Cart, for an extension that keys an external system by it,
  such as an order management system. Read this field instead of parsing `id`.
  
  Not part of the public API: available to `@requires`, and removed from the
  composed schema.
  """
  _ctId: ID! @inaccessible
  custom: OrderCustom
}

"""
Action the current viewer can take on a Cart. A value is listed only when the mutation
behind it would run for this Cart, so the list can be narrower than what
`Viewer.permissions` allows.
"""
enum CartAction {
  """
  Place an Order with `checkout` or `placeOrder`. Offered to a signed-in Customer.
  In a Business Unit, the Associate also needs permission to create Orders from the
  Cart.
  """
  CHECKOUT
  """
  Place an Order as a guest with `guestCheckout`. Offered to an anonymous session
  outside a Business Unit.
  """
  GUEST_CHECKOUT
  """
  Remove all lines with `clearCart`. In a Business Unit, the Associate needs
  permission to update the Cart.
  """
  CLEAR
  """
  Request a Quote for the Cart with `requestQuote`. Offered in a Business Unit when
  the Cart has a shipping address and the Associate has permission to create Quote
  Requests.
  """
  REQUEST_QUOTE
}

"""
A line in a Cart: a Product Variant and its quantity, or a custom line that the
merchant added.
"""
type CartLine implements Node {
  """
  Unique identifier of the Cart line. Pass it as `lineId` to change or remove the
  line.
  """
  id: ID!
  """SKU of the Product Variant. Empty string for a custom line."""
  sku: String!
  """
  Name of the Product in the session's locale. For a custom line, the name of the
  line.
  """
  productName: String!
  """
  Slug of the Product in the session's locale. Empty string for a custom line.
  """
  slug: String!
  """
  First image of the Product Variant. `null` if the Product Variant has no image,
  and for a custom line.
  """
  image: Image
  """Quantity of the Product Variant in the Cart."""
  quantity: Int!
  """
  What this Line Item costs after every discount: its Portions' `unitPrice` times `quantity`, added up. On an `EXTERNAL_TOTAL` Line Item it is the total the external system set instead.
  """
  lineTotal: Money!
  """
  Stock available for this line. A custom line, or a Product Variant without tracked
  inventory, has `inStock` set to `true` and `quantity` set to `null`.
  """
  availability: Availability!
  """
  Whether this is a free Gift Line Item the platform added. Its Portion lists the gift discount that added it, which carries the same `id` as that discount's entry in `discounts`.
  """
  isGift: Boolean!
  """One unit before any discount: the Line Item's price."""
  unitPriceBeforeDiscount: Money!
  """How the Line Item's price was set; null for a custom line."""
  priceMode: LinePriceMode
  """
  One unit after its Product Discount, and the Product Discount behind it; null when none applies. Kept where a Best Deal rejected it: see `rejectedByBestDeal`.
  """
  discountedPrice: LineItemDiscountedPrice
  """
  The Line Item's units grouped by what one unit costs after Cart Discounts; at least one.
  """
  portions: [Portion!]!
  custom: LineItemCustom
}

"""
Returned by every Cart mutation. Check `userErrors` first: if it is empty, the
