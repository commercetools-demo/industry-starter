  """
  cursor: String!
}

"""
Filters for `quoteRequests`. A Quote Request must match every field you set.
"""
input QuoteRequestFilter {
  """
  Matches a Quote Request whose `reference` equals this value. The match is exact,
  not a substring search.
  """
  query: String
  """
  Matches Quote Requests in any of these states. `UNKNOWN` matches nothing.
  """
  quoteRequestState: [QuoteRequestState!]
}

"""Returned by `requestQuote` and `cancelQuoteRequest`."""
type QuoteRequestResult {
  """
  The Quote Request after the mutation. `null` if the mutation failed, except for
  `QUOTE_REQUEST_NOT_ACTIONABLE`, which returns the unchanged Quote Request.
  """
  quoteRequest: QuoteRequest
  """Errors that prevented the mutation. Empty on success."""
  userErrors: [UserError!]!
}

"""State of a Quote Request in the negotiation process."""
enum QuoteRequestState {
  """
  The Buyer submitted the Quote Request, and the Seller hasn't accepted or rejected it
  yet. Initial state of a Quote Request.
  """
  SUBMITTED
  """
  Reserved state. A Quote Request can report it, but no operation in this API sets it.
  """
  UNDER_REVIEW
  """
  The Seller accepted the Quote Request and is preparing a Quote for the Buyer.
  """
  ACCEPTED
  """The Seller rejected the Quote Request, which ends the negotiation."""
  REJECTED
  """
  The Buyer withdrew the Quote Request, for example with `cancelQuoteRequest`.
  """
  CANCELLED
  """
  Final state. The Seller accepted the Quote Request, and no further action is
  possible.
  """
  CLOSED
  """
  A state that this API doesn't model. The Quote Request is still listed. Treat it as
  read-only.
  """
  UNKNOWN
}

"""Returned by `acceptQuote`, `declineQuote`, and `renegotiateQuote`."""
type QuoteResult {
  """
  The Quote after the mutation. If a check before the write refuses the mutation, for
  example because of the Quote's state or expiry, or a permission that
  `availableActions` reflects, this is the unchanged Quote. If the platform refuses
  the write, `quote` is `null`. For example, `declineQuote` with a `reason`
  but without the permission to renegotiate returns `FORBIDDEN_ACTION` and a
  `null` Quote.
  """
  quote: Quote
  """Order created from the Quote. Set only by a successful `acceptQuote`."""
  order: Order
  """Errors that prevented the mutation. Empty on success."""
  userErrors: [UserError!]!
}

"""
Negotiation state of a Quote. Expiry isn't a state, see `Quote.expiresAt`.
"""
enum QuoteState {
  """
  The Seller sent the Quote, and the Buyer hasn't replied yet. Only a `PENDING`
  Quote can be accepted, declined, or renegotiated.
  """
  PENDING
  """
  The Buyer declined the Quote and asked to renegotiate it. The Seller hasn't answered
  yet.
  """
  DECLINED_FOR_RENEGOTIATION
  """
  The Seller answered the renegotiation request with a new Quote. This Quote offers no
  actions.
  """
  RENEGOTIATION_ADDRESSED
  """
  The Buyer accepted the Quote. `acceptQuote` also creates an Order from it in the
  same step.
  """
  ACCEPTED
  """
  The Buyer declined the Quote. `buyerComment` holds the reason, if the Buyer gave
  one.
  """
  DECLINED
  """The Seller withdrew the Quote before the Buyer accepted it."""
  WITHDRAWN
  """
  A state that this API doesn't model. The Quote is still listed and offers no
  `availableActions`. Treat it as read-only.
  """
  UNKNOWN
}

